<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curriculum Pathways</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --encre:#16233A; --papier:#E9EAE3; --carte:#FAFAF6; --reglure:#C9CDBF;
  --tampon:#A83A2C; --vert:#2E5E4E; --ambre:#8A6A1F; --sourd:#616A5C;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --slab:"Zilla Slab",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--papier);color:var(--encre);font-family:var(--sans);
  font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px 100px}

header.top{padding:30px 0 16px;border-bottom:2px solid var(--encre);margin-bottom:22px}
header.top h1{font-family:var(--slab);font-size:27px;font-weight:700;margin:0 0 5px}
header.top p{font-size:14px;color:var(--sourd);margin:0;max-width:64ch}

/* ---- the three choices ---- */
.picker{background:var(--carte);border:1px solid var(--reglure);border-radius:3px;
  padding:20px 22px;margin-bottom:22px}
.pickrow{margin-bottom:18px}
.pickrow:last-child{margin-bottom:0}
.pickrow > .lbl{font-size:12px;font-weight:700;color:var(--sourd);margin-bottom:8px;display:block}
.opts{display:flex;flex-wrap:wrap;gap:7px}
button.opt{font-family:var(--sans);font-size:14px;border:1px solid var(--reglure);
  background:#fff;color:var(--encre);border-radius:3px;padding:9px 14px;cursor:pointer;text-align:left}
button.opt:hover{border-color:var(--encre)}
button.opt[aria-pressed="true"]{background:var(--encre);color:#fff;border-color:var(--encre);font-weight:600}
button.opt .sub{display:block;font-size:11.5px;opacity:.72;font-weight:400;margin-top:1px}

/* ---- the answer ---- */
.answer{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:22px}
.stat{background:var(--carte);border:1px solid var(--reglure);border-radius:3px;padding:14px 16px}
.stat .n{font-family:var(--slab);font-size:26px;font-weight:700;line-height:1.1}
.stat .k{font-size:12px;color:var(--sourd);margin-top:3px}
.stat.warn{border-color:var(--tampon);background:#FDF4F1}
.stat.warn .n{color:var(--tampon)}

.note{border-left:3px solid var(--ambre);background:#FBF7EC;padding:11px 14px;
  margin-bottom:22px;font-size:13.5px;line-height:1.55}
.note b{font-weight:600}

/* ---- lesson list ---- */
.mod{margin-top:24px}
.mod > h3{font-family:var(--slab);font-size:16px;margin:0 0 2px}
.mod > .modmeta{font-size:12px;color:var(--sourd);margin:0 0 4px}
.mod > .modnote{font-size:12.5px;color:var(--sourd);font-style:italic;margin:0 0 9px;
  border-left:2px solid var(--reglure);padding-left:10px}
.les{background:var(--carte);border:1px solid var(--reglure);border-radius:3px;
  padding:12px 14px;margin-bottom:7px}
.les .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.les .code{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;color:var(--sourd)}
.les .ti{font-weight:600;font-size:14.5px;flex:1;min-width:200px}
.les .hrs{font-size:12px;color:var(--sourd)}
.les ul{margin:8px 0 0;padding-left:18px;font-size:13.5px;color:var(--encre)}
.les li{margin-bottom:3px}
.les .fr{color:var(--sourd);font-size:12.5px;display:block;margin-top:1px}

.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:2px;white-space:nowrap}
.tag.scaffold{background:#EDEEE6;color:var(--sourd)}
.tag.core{background:#E4EDE7;color:var(--vert)}
.tag.extension{background:#E9EBF2;color:#4A5B78}
.tag.advanced{background:#F7E7E4;color:var(--tampon)}
.tag.lvl{background:#F2EFE6;color:var(--ambre)}

.trackhead{margin-top:34px;padding:12px 16px;border-radius:3px;color:#fff;
  font-family:var(--slab);font-size:17px;font-weight:700}
.trackhead .sub{font-family:var(--sans);font-size:12.5px;font-weight:400;opacity:.85;display:block;margin-top:2px}

.langbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:14px}
button.lang{font-family:var(--sans);font-size:13px;border:1px solid var(--reglure);
  background:#fff;color:var(--sourd);border-radius:20px;padding:6px 14px;cursor:pointer}
button.lang[aria-pressed="true"]{background:var(--encre);color:#fff;border-color:var(--encre);font-weight:600}

.empty{background:var(--carte);border:1px dashed var(--reglure);border-radius:3px;
  padding:26px;text-align:center;color:var(--sourd);font-style:italic}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--reglure);
  font-size:12.5px;color:var(--sourd);line-height:1.6;max-width:72ch}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <h1>Curriculum pathways</h1>
  <p>Every lesson is written once. A pathway is a filter over them — choose
     who is starting and how fast, and this shows exactly what that cohort gets.</p>
</header>

<div class="langbar">
  <button class="lang" data-lang="en" aria-pressed="true">English</button>
  <button class="lang" data-lang="fr" aria-pressed="false">Français</button>
</div>

<div class="picker">
  <div class="pickrow"><span class="lbl" id="lblLevel">WHERE THEY ARE STARTING</span>
    <div class="opts" id="levels"></div></div>
  <div class="pickrow"><span class="lbl" id="lblPace">HOW FAST</span>
    <div class="opts" id="paces"></div></div>
  <div class="pickrow"><span class="lbl" id="lblTrack">WHICH BRANCH</span>
    <div class="opts" id="branches"></div></div>
</div>

<div class="answer" id="stats"></div>
<div id="warning"></div>
<div id="out"></div>

<footer id="foot"></footer>
</div>

<script>
const DATA = {"levels":[{"code":"L0","rank":0,"name":{"en":"Beginner","fr":"Débutant"},"desc":{"en":"Little or no computer experience. May not have used a keyboard much.","fr":"Peu ou pas d'expérience de l'ordinateur. A peu utilisé un clavier."}},{"code":"L1","rank":1,"name":{"en":"Computer literate","fr":"À l'aise avec l'outil informatique"},"desc":{"en":"Uses a phone and basic office software. No programming.","fr":"Utilise un téléphone et des logiciels bureautiques. Pas de programmation."}},{"code":"L2","rank":2,"name":{"en":"Some technical background","fr":"Quelques bases techniques"},"desc":{"en":"Has written a little code or administered a machine. Self-taught or part-way through study.","fr":"A écrit un peu de code ou administré une machine. Autodidacte ou en cours d'études."}},{"code":"L3","rank":3,"name":{"en":"Intermediate","fr":"Intermédiaire"},"desc":{"en":"Works in the field or has studied it formally. Wants depth, not a restart.","fr":"Travaille dans le domaine ou l'a étudié. Cherche de la profondeur, pas un recommencement."}},{"code":"L4","rank":4,"name":{"en":"Advanced","fr":"Avancé"},"desc":{"en":"Experienced. Here for the specialised material at the top of a branch.","fr":"Expérimenté. Vient pour le contenu spécialisé en haut de filière."}}],"paces":[{"code":"steady","tiers":["scaffold","core","extension","advanced"],"name":{"en":"Steady","fr":"Progressif"},"desc":{"en":"Everything. Scaffolding, extra practice, the slower explanations.","fr":"Tout. Étayage, pratique supplémentaire, explications détaillées."}},{"code":"standard","tiers":["core","extension","advanced"],"name":{"en":"Standard","fr":"Standard"},"desc":{"en":"Core plus the extensions most people need.","fr":"L'essentiel plus les approfondissements utiles à la plupart."}},{"code":"fast","tiers":["core","advanced"],"name":{"en":"Fast track","fr":"Accéléré"},"desc":{"en":"Core only. Assumes the learner fills gaps themselves.","fr":"L'essentiel seul. Suppose que l'apprenant comble les lacunes lui-même."}}],"tiers":[{"code":"scaffold","name":{"en":"Extra support","fr":"Étayage"}},{"code":"core","name":{"en":"Core","fr":"Essentiel"}},{"code":"extension","name":{"en":"Extension","fr":"Approfondissement"}},{"code":"advanced","name":{"en":"Advanced","fr":"Avancé"}}],"tracks":[{"code":"F","kind":"foundation","name":{"en":"Foundation","fr":"Tronc commun"},"color":"#16233A","blurb":{"en":"Shared by every track. Ends where the four specialisms genuinely diverge.","fr":"Commun à toutes les filières. Se termine là où les quatre spécialités divergent réellement."},"modules":[{"code":"M1","title":{"en":"Using a computer","fr":"Se servir d'un ordinateur"},"note":{"en":"For learners who have not used a computer before. Skipped from L1 up.","fr":"Pour les apprenants n'ayant jamais utilisé d'ordinateur. Ignoré à partir de N1."},"lessons":[{"code":"F-1.1","level":"L0","tier":"core","hours":2,"title":{"en":"Switching on, logging in, shutting down","fr":"Allumer, se connecter, éteindre"},"objectives":[{"code":"F-1.1.1","text":{"en":"Start the machine, log in, and shut it down properly without help","fr":"Démarrer la machine, se connecter et l'éteindre correctement, sans aide"}}]},{"code":"F-1.2","level":"L0","tier":"core","hours":3,"title":{"en":"Keyboard and mouse","fr":"Clavier et souris"},"objectives":[{"code":"F-1.2.1","text":{"en":"Type a short paragraph including accented characters and punctuation","fr":"Saisir un court paragraphe avec accents et ponctuation"}},{"code":"F-1.2.2","text":{"en":"Select, copy, cut and paste text between two windows","fr":"Sélectionner, copier, couper et coller du texte entre deux fenêtres"}}]},{"code":"F-1.3","level":"L0","tier":"scaffold","hours":2,"title":{"en":"Practice: typing with confidence","fr":"Pratique : gagner en aisance au clavier"},"objectives":[{"code":"F-1.3.1","text":{"en":"Type continuously for five minutes without looking at the keyboard","fr":"Taper cinq minutes sans regarder le clavier"}}]},{"code":"F-1.4","level":"L0","tier":"core","hours":2,"title":{"en":"Windows, menus and moving between programs","fr":"Fenêtres, menus et navigation entre programmes"},"objectives":[{"code":"F-1.4.1","text":{"en":"Open two programs, move between them, and resize both windows","fr":"Ouvrir deux programmes, passer de l'un à l'autre et redimensionner les deux fenêtres"}}]},{"code":"F-1.5","level":"L0","tier":"core","hours":2,"title":{"en":"Staying safe: passwords and what not to click","fr":"Sécurité de base : mots de passe et pièges à éviter"},"objectives":[{"code":"F-1.5.1","text":{"en":"Choose a password that meets a stated policy and explain why length beats complexity","fr":"Choisir un mot de passe conforme à une règle donnée et expliquer pourquoi la longueur prime sur la complexité"}},{"code":"F-1.5.2","text":{"en":"Identify three warning signs in a suspicious message shown to them","fr":"Repérer trois signaux d'alerte dans un message suspect qu'on leur présente"}}]}]},{"code":"M2","title":{"en":"Files and where things live","fr":"Fichiers et emplacements"},"lessons":[{"code":"F-2.1","level":"L0","tier":"core","hours":2,"title":{"en":"What a file is, and what a folder is","fr":"Qu'est-ce qu'un fichier, qu'est-ce qu'un dossier"},"objectives":[{"code":"F-2.1.1","text":{"en":"Create a folder, save a file into it, close everything, and find that file again","fr":"Créer un dossier, y enregistrer un fichier, tout fermer, puis retrouver ce fichier"}}]},{"code":"F-2.2","level":"L1","tier":"core","hours":2,"title":{"en":"File types, extensions and what opens what","fr":"Types de fichiers, extensions et applications associées"},"objectives":[{"code":"F-2.2.1","text":{"en":"Predict which program opens a given file from its extension, and open it with a different one deliberately","fr":"Prédire quel programme ouvre un fichier d'après son extension, puis l'ouvrir volontairement avec un autre"}}]},{"code":"F-2.3","level":"L1","tier":"core","hours":3,"title":{"en":"The command line, and why it exists","fr":"La ligne de commande, et sa raison d'être"},"objectives":[{"code":"F-2.3.1","text":{"en":"Move around the filesystem, list a directory, and create, copy and delete a file from a terminal","fr":"Se déplacer dans l'arborescence, lister un répertoire, créer, copier et supprimer un fichier depuis un terminal"}},{"code":"F-2.3.2","text":{"en":"Name one task that is faster from the terminal than from a file browser, and do it","fr":"Nommer une tâche plus rapide au terminal qu'à la souris, et la réaliser"}}]},{"code":"F-2.4","level":"L1","tier":"scaffold","hours":2,"title":{"en":"Practice: a filing system that survives","fr":"Pratique : un classement qui tient dans le temps"},"objectives":[{"code":"F-2.4.1","text":{"en":"Organise twenty loose files into a structure they can explain to someone else","fr":"Ranger vingt fichiers épars dans une structure qu'ils peuvent expliquer à un tiers"}}]},{"code":"F-2.5","level":"L2","tier":"extension","hours":2,"title":{"en":"Permissions: who can read, write and run","fr":"Permissions : lire, écrire, exécuter"},"objectives":[{"code":"F-2.5.1","text":{"en":"Read a permissions string and change a file so only its owner can modify it","fr":"Lire une chaîne de permissions et modifier un fichier pour que seul son propriétaire puisse l'éditer"}}]}]},{"code":"M3","title":{"en":"How a computer represents things","fr":"Comment l'ordinateur représente les choses"},"lessons":[{"code":"F-3.1","level":"L1","tier":"core","hours":2,"title":{"en":"Everything is numbers underneath","fr":"Tout est nombre en dessous"},"objectives":[{"code":"F-3.1.1","text":{"en":"Convert a number under 256 between binary and decimal, both directions","fr":"Convertir un nombre inférieur à 256 entre binaire et décimal, dans les deux sens"}},{"code":"F-3.1.2","text":{"en":"Explain how text becomes numbers, naming the role of a character encoding","fr":"Expliquer comment le texte devient des nombres, en nommant le rôle d'un encodage de caractères"}}]},{"code":"F-3.2","level":"L1","tier":"extension","hours":2,"title":{"en":"Why accented characters break","fr":"Pourquoi les caractères accentués posent problème"},"note":{"en":"Deliberately included. Every learner here will hit mangled French text.","fr":"Volontairement inclus. Chaque apprenant rencontrera du texte français mal encodé."},"objectives":[{"code":"F-3.2.1","text":{"en":"Take a file whose accents display as nonsense and correct its encoding","fr":"Corriger l'encodage d'un fichier dont les accents s'affichent en charabia"}}]},{"code":"F-3.3","level":"L1","tier":"core","hours":2,"title":{"en":"What the parts of a computer do","fr":"Le rôle des composants"},"objectives":[{"code":"F-3.3.1","text":{"en":"Say what processor, memory and storage each do, and what is lost when power is cut","fr":"Dire ce que font processeur, mémoire et stockage, et ce qui est perdu en cas de coupure"}}]},{"code":"F-3.4","level":"L2","tier":"core","hours":2,"title":{"en":"What an operating system is for","fr":"À quoi sert un système d'exploitation"},"objectives":[{"code":"F-3.4.1","text":{"en":"Explain what sits between a program and the hardware, and name two things it stops programs doing","fr":"Expliquer ce qui se place entre un programme et le matériel, et nommer deux choses qu'il empêche"}}]}]},{"code":"M4","title":{"en":"Thinking in steps","fr":"Raisonner par étapes"},"lessons":[{"code":"F-4.1","level":"L1","tier":"core","hours":2,"title":{"en":"Breaking a task into unambiguous steps","fr":"Décomposer une tâche en étapes non ambiguës"},"objectives":[{"code":"F-4.1.1","text":{"en":"Write instructions for an everyday task that a stranger can follow with no guessing","fr":"Rédiger les instructions d'une tâche courante qu'un inconnu peut suivre sans deviner"}}]},{"code":"F-4.2","level":"L1","tier":"scaffold","hours":2,"title":{"en":"Practice: instructions that go wrong","fr":"Pratique : quand les instructions dérapent"},"objectives":[{"code":"F-4.2.1","text":{"en":"Follow a classmate's instructions literally and identify every ambiguity that caused a wrong result","fr":"Suivre littéralement les instructions d'un camarade et relever chaque ambiguïté ayant produit une erreur"}}]},{"code":"F-4.3","level":"L1","tier":"core","hours":3,"title":{"en":"Decisions and repetition","fr":"Décisions et répétitions"},"objectives":[{"code":"F-4.3.1","text":{"en":"Write pseudocode for a problem that needs both a decision and a repetition","fr":"Écrire le pseudocode d'un problème nécessitant une décision et une répétition"}}]},{"code":"F-4.4","level":"L2","tier":"core","hours":2,"title":{"en":"Tracing: predicting what code will do","fr":"Dérouler : prédire le comportement du code"},"objectives":[{"code":"F-4.4.1","text":{"en":"Trace a short algorithm by hand and state its output before running it — correctly","fr":"Dérouler un algorithme court à la main et annoncer sa sortie avant exécution — correctement"}}]},{"code":"F-4.5","level":"L2","tier":"core","hours":2,"title":{"en":"Finding the faulty step","fr":"Trouver l'étape fautive"},"objectives":[{"code":"F-4.5.1","text":{"en":"Given an algorithm that produces the wrong answer, locate the faulty step and correct it","fr":"Face à un algorithme qui donne un mauvais résultat, localiser l'étape fautive et la corriger"}}]}]},{"code":"M5","title":{"en":"Writing programs","fr":"Écrire des programmes"},"lessons":[{"code":"F-5.1","level":"L1","tier":"core","hours":3,"title":{"en":"Your first program: input, store, output","fr":"Premier programme : lire, stocker, afficher"},"objectives":[{"code":"F-5.1.1","text":{"en":"Write and run a program that reads something typed in, stores it, and prints a result derived from it","fr":"Écrire et exécuter un programme qui lit une saisie, la stocke et affiche un résultat qui en dérive"}}]},{"code":"F-5.2","level":"L1","tier":"core","hours":3,"title":{"en":"Types, and what happens when they are wrong","fr":"Types, et ce qui arrive quand ils sont faux"},"objectives":[{"code":"F-5.2.1","text":{"en":"Predict and then demonstrate what happens when a number is treated as text and vice versa","fr":"Prédire puis démontrer ce qui se passe quand un nombre est traité comme du texte, et l'inverse"}}]},{"code":"F-5.3","level":"L1","tier":"scaffold","hours":3,"title":{"en":"Practice: small programs, many of them","fr":"Pratique : beaucoup de petits programmes"},"objectives":[{"code":"F-5.3.1","text":{"en":"Complete six short exercises with no more than one prompt each from the instructor","fr":"Réaliser six exercices courts avec au plus une aide de l'instructeur chacun"}}]},{"code":"F-5.4","level":"L1","tier":"core","hours":3,"title":{"en":"Conditions in real code","fr":"Les conditions en vrai code"},"objectives":[{"code":"F-5.4.1","text":{"en":"Write a working program that behaves differently for at least three distinct inputs","fr":"Écrire un programme fonctionnel qui se comporte différemment selon au moins trois entrées distinctes"}}]},{"code":"F-5.5","level":"L1","tier":"core","hours":3,"title":{"en":"Loops","fr":"Les boucles"},"objectives":[{"code":"F-5.5.1","text":{"en":"Write a loop that processes a list, and a loop that stops when a condition is met","fr":"Écrire une boucle qui parcourt une liste, et une boucle qui s'arrête à une condition"}},{"code":"F-5.5.2","text":{"en":"Cause a loop that never ends, explain why, and fix it","fr":"Provoquer une boucle infinie, expliquer pourquoi, puis la corriger"}}]},{"code":"F-5.6","level":"L2","tier":"core","hours":3,"title":{"en":"Functions: naming a piece of work","fr":"Fonctions : nommer un traitement"},"objectives":[{"code":"F-5.6.1","text":{"en":"Take a program with repeated code and rewrite it as a function with parameters and a return value","fr":"Transformer du code répété en une fonction avec paramètres et valeur de retour"}}]},{"code":"F-5.7","level":"L2","tier":"core","hours":3,"title":{"en":"Reading errors","fr":"Lire les erreurs"},"note":{"en":"The single highest-leverage lesson in the foundation. A learner who ar sa clé et expliquer pourquoi cela bat un parcours de liste quand elle est longue"}}]},{"code":"F-6.3","level":"L2","tier":"extension","hours":2,"title":{"en":"Choosing how to hold something","fr":"Choisir une structure"},"objectives":[{"code":"F-6.3.1","text":{"en":"Pick a suitable structure for a stated problem and defend the choice against one alternative","fr":"Choisir une structure adaptée à un problème donné et défendre ce choix face à une alternative"}}]},{"code":"F-6.4","level":"L2","tier":"core","hours":3,"title":{"en":"Data that outlives the program: tables and rows","fr":"Des données qui survivent au programme : tables et lignes"},"objectives":[{"code":"F-6.4.1","text":{"en":"Design a table for a described situation, with a primary key they can justify","fr":"Concevoir une table pour une situation décrite, avec une clé primaire justifiable"}}]},{"code":"F-6.5","level":"L2","tier":"core","hours":3,"title":{"en":"Asking a database a question","fr":"Interroger une base de données"},"objectives":[{"code":"F-6.5.1","text":{"en":"Write a query with a filter and a sort that answers a question posed in words","fr":"Écrire une requête avec filtre et tri répondant à une question posée en français"}}]},{"code":"F-6.6","level":"L2","tier":"extension","hours":3,"title":{"en":"Joining two tables","fr":"Joindre deux tables"},"objectives":[{"code":"F-6.6.1","text":{"en":"Join two related tables and say in words what each row of the result represents","fr":"Joindre deux tables liées et dire en mots ce que représente chaque ligne du résultat"}}]}]},{"code":"M7","title":{"en":"How machines talk to each other","fr":"Comment les machines communiquent"},"lessons":[{"code":"F-7.1","level":"L1","tier":"core","hours":2,"title":{"en":"What happens when you open a web page","fr":"Ce qui se passe quand on ouvre une page web"},"objectives":[{"code":"F-7.1.1","text":{"en":"Describe the path a request takes from a device to a server and back, naming four stages","fr":"Décrire le trajet d'une requête d'un appareil au serveur et retour, en nommant quatre étapes"}}]},{"code":"F-7.2","level":"L2","tier":"core","hours":2,"title":{"en":"Addresses, names and ports","fr":"Adresses, noms et ports"},"objectives":[{"code":"F-7.2.1","text":{"en":"Explain how a domain name becomes a machine address, and what a port adds","fr":"Expliquer comment un nom de domaine devient une adresse machine, et ce qu'ajoute un port"}}]},{"code":"F-7.3","level":"L2","tier":"core","hours":3,"title":{"en":"Requests and responses in detail","fr":"Requêtes et réponses en détail"},"objectives":[{"code":"F-7.3.1","text":{"en":"Read a request and its response and say what was asked for and what came back","fr":"Lire une requête et sa réponse et dire ce qui a été demandé et ce qui est revenu"}}]},{"code":"F-7.4","level":"L2","tier":"extension","hours":2,"title":{"en":"When the network is the problem","fr":"Quand le problème vient du réseau"},"note":{"en":"Written for where this runs. Connectivity here is intermittent, and knowing whether a failure is yours or the network's is a daily skill, not an advanced one.","fr":"Écrit pour le contexte local. La connectivité y est intermittente : savoir si une panne vient de soi ou du réseau est une compétence quotidienne."},"objectives":[{"code":"F-7.4.1","text":{"en":"Given something that will not load, determine whether the fault is local, the network, or the far end","fr":"Face à quelque chose qui ne charge pas, déterminer si la panne est locale, réseau, ou à distance"}}]}]},{"code":"M8","title":{"en":"Working with other people","fr":"Travailler avec les autres"},"lessons":[{"code":"F-8.1","level":"L2","tier":"core","hours":3,"title":{"en":"Version control: never losing work again","fr":"Gestion de versions : ne plus jamais perdre son travail"},"objectives":[{"code":"F-8.1.1","text":{"en":"Commit work, then recover a file as it was three commits ago","fr":"Valider son travail, puis récupérer un fichier tel qu'il était trois commits plus tôt" on as missing. Tests fail in both directions.","fr":"Tiré de ce projet : un test lisait le CSV en texte, où le décodeur supprime justement la marque qu'il vérifiait. Il signalait comme absente une protection fonctionnelle."},"objectives":[{"code":"DEV-2.3.1","text":{"en":"Show that a given test passes even when the behaviour it claims to check is broken","fr":"Montrer qu'un test donné passe alors même que le comportement vérifié est cassé"}}]},{"code":"DEV-2.4","level":"L4","tier":"advanced","hours":3,"title":{"en":"Tests that only pass once","fr":"Les tests qui ne passent qu'une fois"},"note":{"en":"Also from this project. Two suites shared a fixture and fixed dates, so they passed on a clean database and failed on every run after — which reads as a product bug and is not one.","fr":"Également tiré de ce projet. Deux suites partageaient des données et des dates fixes : elles passaient sur base neuve puis échouaient ensuite."},"objectives":[{"code":"DEV-2.4.1","text":{"en":"Take a test suite that passes once and make it repeatable, without simply resetting the database","fr":"Rendre répétable une suite qui ne passe qu'une fois, sans se contenter de réinitialiser la base"}}]}]},{"code":"M3","title":{"en":"Building for other programs","fr":"Construire pour d'autres programmes"},"lessons":[{"code":"DEV-3.1","level":"L2","tier":"core","hours":3,"title":{"en":"What an API is","fr":"Qu'est-ce qu'une API"},"objectives":[{"code":"DEV-3.1.1","text":{"en":"Call an existing API and use what comes back in a program of their own","fr":"Appeler une API existante et exploiter la réponse dans leur propre programme"}}]},{"code":"DEV-3.2","level":"L3","tier":"core","hours":4,"title":{"en":"Building one","fr":"En construire une"},"objectives":[{"code":"DEV-3.2.1","text":{"en":"Build an endpoint that accepts data, validates it, stores it, and returns a useful error when the data is wrong","fr":"Construire un point d'entrée qui accepte, valide et stocke des données, et renvoie une erreu  are protecting, and from whom","fr":"Ce que l'on protège, et contre qui"},"objectives":[{"code":"SEC-1.1.1","text":{"en":"For a described organisation, name what would hurt most if lost, changed, or made public","fr":"Pour une organisation décrite, nommer ce dont la perte, l'altération ou la divulgation ferait le plus de mal"}}]},{"code":"SEC-1.2","level":"L2","tier":"core","hours":3,"title":{"en":"Threat, vulnerability, risk","fr":"Menace, vulnérabilité, risque"},"objectives":[{"code":"SEC-1.2.1","text":{"en":"Given an incident, separate the three and say which one the organisation could actually have changed","fr":"Face à un incident, distinguer les trois et dire lequel l'organisation pouvait réellement changer"}}]},{"code":"SEC-1.3","level":"L2","tier":"core","hours":2,"title":{"en":"Spending effort where it pays","fr":"Investir l'effort là où il rapporte"},"objectives":[{"code":"SEC-1.3.1","text":{"en":"Rank five possible defences for a small organisation by what they prevent per hour spent","fr":"Classer cinq défenses possibles pour une petite structure selon ce qu'elles évitent par heure investie"}}]},{"code":"SEC-1.4","level":"L2","tier":"core","hours":1,"title":{"en":"The law, and permission","fr":"La loi, et l'autorisation"},"note":{"en":"Taught before anything offensive, not after. Everything in this branch that touches a system is done on systems the learner owns or has written permission to test.","fr":"Enseigné avant toute pratique offensive, pas après. Tout dans cette filière se fait sur des systèmes possédés ou testés avec autorisation écrite."},"objectives":[{"code":"SEC-1.4.1","text":{"en":"State what written permission to test must contain, and why testing without it is a crime regardless of intent","fr":"Énoncer ce que doit contenir une autorisation écrite de test, et pourquoi tester sans elle est un délit quelle que soit l'intention"}}]}]},{"code":"M2","title":{"en":"Networks, from a defender's side","fr":"Les réseaux, côté défense"},"lessons":[{"code":"SEC-2.1","level":"L2","tier":"core","hours":3,"title":{"en":"What is listening on this machine","fr":"Ce qui écoute sur cette machine"},"objectives":[{"code":"SEC-2.1.1","text":{"en":"List every open port on a machine they own and account for each one","fr":"Lister chaque port ouvert sur une machine leur appartenant et justifier chacun"}}]},{"code":"SEC-2.2","level":"L2","tier":"core","hours":3,"title":{"en":"Firewalls","fr":"Pare-feux"},"objectives":[{"code":"SEC-2.2.1","text":{"en":"Write rules that permit exactly one service and block everything else, then prove both halves","fr":"Écrire des règles autorisant exactement un service et bloquant le reste, puis prouver les deux"}}]},{"code":"SEC-2.3","level":"L3","tier":"core","hours":3,"title":{"en":"Watching traffic","fr":"Observer le trafic"},"objectives":[{"code":"SEC-2.3.1","text":{"en":"Capture their own traffic and find a credential sent without encryption","fr":"Capturer leur propre trafic et y trouver un identifiant transmis sans chiffrement"}}]},{"code":"SEC-2.4","level":"L3","tier":"extension","hours":3,"title":{"en":"Keeping things apart","fr":"Cloisonner"},"objectives":[{"code":"SEC-2.4.1","text":{"en":"Design a network where compromising the guest wifi does not reach the accounting machine","fr":"Concevoir un réseau où compromettre le wifi invité n'atteint pas la machine comptable"}}]}]},{"code":"M3","title":{"en":"Identity","fr":"Identité"},"lessons":[{"code":"SEC-3.1","level":"L2","tier":"core","hours":2,"title":{"en":"Proving who you are, and what you may do","fr":"Prouver qui on est, et ce qu'on peut faire"},"objectives":[{"code":"SEC-3.1.1","text":{"en":"Give an example of each failing separately, and say which is worse and why","fr":"Donner un exemple de chaque défaillance séparément, et dire laquelle est pire, et pourquoi"}}]},{"code":"SEC-3.2","level":"L2","tier":"core","hours":3,"title":{"en":"Passwords, and why they keep failing","fr":"Les mots de passe, et pourquoi ils échouent"},"ob phy.","fr":"De quoi choisir et utiliser correctement. Pas de quoi en concevoir, volontairement : personne ici ne devrait écrire de cryptographie."},"lessons":[{"code":"SEC-5.1","level":"L2","tier":"core","hours":2,"title":{"en":"Hashing is not encryption","fr":"Hacher n'est pas chiffrer"},"objectives":[{"code":"SEC-5.1.1","text":{"en":"Say which to use for stored passwords and why the other is wrong","fr":"Dire lequel utiliser pour stocker des mots de passe et pourquoi l'autre est faux"}}]},{"code":"SEC-5.2","level":"L3","tier":"core","hours":3,"title":{"en":"Agreeing a secret with a stranger","fr":"Convenir d'un secret avec un inconnu"},"objectives":[{"code":"SEC-5.2.1","text":{"en":"Explain how two machines that have never met agree a key over a network anyone can read","fr":"Expliquer comment deux machines qui ne se connaissent pas conviennent d'une clé sur un réseau lisible par tous"}}]},{"code":"SEC-5.3","level":"L3","tier":"core","hours":3,"title":{"en":"Certificates, and what the padlock means","fr":"Certificats, et ce que signifie le cadenas"},"objectives":[{"code":"SEC-5.3.1","text":{"en":"Say what a valid certificate proves and what it does not — specifically, that it says nothing about honesty","fr":"Dire ce qu'un certificat valide prouve et ne prouve pas — notamment qu'il ne dit rien sur l'honnêteté du site"}}]},{"code":"SEC-5.4","level":"L4","tier":"advanced","hours":3,"title":{"en":"Getting it wrong in ways that look right","fr":"Se tromper d'une manière qui paraît juste"},"objectives":[{"code":"SEC-5.4.1","text":{"en":"Find the flaw in an encryption scheme that appears to work and passes its own tests","fr":"Trouver la faille d'un schéma de chiffrement qui semble marcher et passe ses propres tests"}}]}]},{"code":"M6","title":{"en":"Defending something real","fr":"Défendre quelque chose de réel"},"lessons":[{"code":"SEC-6.1","level":"L2","tier":"core","hours":3,"title":{"en":"Hardening a machine","fr":"Durcir une machine"},"objectives":[{"code":"SEC-6. ngement"}}]}]},{"code":"M7","title":{"en":"The assessment","fr":"L'évaluation"},"lessons":[{"code":"SEC-7.1","level":"L2","tier":"core","hours":3,"title":{"en":"Scoping a review","fr":"Cadrer un audit"},"objectives":[{"code":"SEC-7.1.1","text":{"en":"Write a scope stating what will be tested, what will not, and what happens if something breaks","fr":"Rédiger un périmètre indiquant ce qui sera testé, ce qui ne le sera pas, et la conduite à tenir en cas de casse"}}]},{"code":"SEC-7.2","level":"L2","tier":"core","hours":12,"title":{"en":"Reviewing a system end to end","fr":"Auditer un système de bout en bout"},"objectives":[{"code":"SEC-7.2.1","text":{"en":"Assess a system provided for the purpose and produce findings ranked by what they would actually cost","fr":"Évaluer un système fourni à cet effet et produire des constats classés par coût réel"}}]},{"code":"SEC-7.3","level":"L2","tier":"core","hours":3,"title":{"en":"A report someone will act on","fr":"Un rapport sur lequel on agira"},"objectives":[{"code":"SEC-7.3.1","text":{"en":"Present findings to someone non-technical who leaves knowing what to fix first","fr":"Présenter des constats à un non-technicien qui repart en sachant quoi corriger en premier"}}]}]}]},{"code":"AI","kind":"branch","requires":"F","name":{"en":"Artificial Intelligence","fr":"Intelligence artificielle"},"color":"#4A5B78","blurb":{"en":"Using models well, and knowing when not to trust them.","fr":"Bien utiliser les modèles, et savoir quand s'en méfier."},"modules":[{"code":"M1","title":{"en":"What these systems are","fr":"Ce que sont ces systèmes"},"lessons":[{"code":"AI-1.1","level":"L2","tier":"core","hours":2,"title":{"en":"Learning from examples instead of rules","fr":"Apprendre d'exemples plutôt que de règles"},"objectives":[{"code":"AI-1.1.1","text":{"en":"Given two problems, say which suits rules and which suits learning, and why","fr":"Face à deux problèmes, dire lequel relève de règles et lequel de l'apprentissage, et pourquoi"}}]},{"code":"AI-1.2","level":"L2","tier":"core","hours":2,"title":{"en":"AI, machine learning, deep learning","fr":"IA, apprentissage automatique, apprentissage profond"},"objectives":[{"code":"AI-1.2.1","text":{"en":"Place the three terms correctly inside one another and give an example of each","fr":"Emboîter correctement les trois termes et donner un exemple de chacun"}}]},{"code":"AI-1.3","level":"L2","tier":"core","hours":2,"title":{"en":"Where it fails","fr":"Où cela échoue"},"note":{"en":"Third lesson, not last. Knowing the limits early stops a learner spending a term building something that could never have worked.","fr":"En troisième, pas en dernier. Connaître les limites tôt évite de passer un trimestre sur un projet condamné."},"objectives":[{"code":"AI-1.3.1","text":{"en":"Given a proposed use, judge whether it is a good fit and name the specific reason","fr":"Face à un usage proposé, juger sa pertinence et nommer la raison précise"}}]}]},{"code":"M2","title":{"en":"Data","fr":"Les données"},"note":{"en":"The largest module, because this is where most of the work is and where most projects fail.","fr":"Le plus gros module, parce que c'est là qu'est le travail et là que la plupart des projets échouent."},"lessons":[{"code":"AI-2.1","level":"L2","tier":"core","hours":3,"title":{"en":"Features and labels","fr":"Variables et étiquettes"},"objectives":[{"code":"AI-2.1.1","text":{"en":"Identify the features and the label in a dataset they have not seen before","fr":"Identifier variables et étiquette dans un jeu de données qu'ils découvrent"}}]},{"code":"AI-2.2","level":"L2","tier":"core","hours":3,"title":{"en":"Cleaning","fr":"Nettoyer"},"objectives":[{"code":"AI-2.2.1","text":{"en":"Handle missing and inconsistent values, and justify each choice rather than deleting rows by default","fr":"Traiter valeurs manquantes et incohérentes, en justifiant chaque choix plutôt que de supprimer par défaut"}}]},{"code":"AI-2.3","level":"L2","tier":"scaffold","hours":3,"title":{"en":"Practice: data that is genuinely messy","fr":"Pratique : des données vraiment sales"},"objectives":[{"code":"AI-2.3.1","text":{"en":"Take a real, unhelpful spreadsheet and get it into a usable shape","fr":"Prendre un vrai tableur inexploitable et le mettre en forme utilisable"}}]},{"code":"AI-2.4","level":"L2","tier":"core","hours":3,"title":{"en":"Bias, and who gets left out","fr":"Biais, et qui se retrouve exclu"},"note":{"en":"Concrete rather than abstract. A model trained on data from one region, one language or one gender fails on everyone else, and the learners here are usually the everyone else.","fr":"Concret plutôt qu'abstrait. Un modèle entraîné sur une seule région, langue ou population échoue sur les autres — et les apprenants ici sont souvent ces autres."},"objectives":[{"code":"AI-2.4.1","text":{"en":"Find who is under-represented in a dataset and predict how the model will fail them specifically","fr":"Trouver qui est sous-représenté dans un jeu de données et prédire comment le modèle leur nuira précisément"}}]},{"code":"AI-2.5","level":"L2","tier":"core","hours":2,"title":{"en":"Training and testing must be separate","fr":"Entraînement et test doivent rester séparés"},"objectives":[{"code":"AI-2.5.1","text":{"en":"Show what happens to a score when test data leaks into training, and explain the number","fr":"Montrer ce qui arrive au score quand les données de test fuitent dans l'entraînement, et expliquer le chiffre"}}]}]},{"code":"M3","title":{"en":"Making predictions","fr":"Faire des prédictions"},"lessons":[{"code":"AI-3.1","level":"L2","tier":"core","hours":2,"title":{"en":"Supervised and unsupervised","fr":"Supervisé et non supervisé"},"objectives":[{"code":"AI-3.1.1","text":{"en":"Sort five described problems into the right category","fr":"Ranger cinq problèmes décrits dans la bonne catégorie"}}]},{"code":"AI-3.2","level":"L2","tier":"core","hours":3,"title":{"en":"A first model, end to end","fr":"Un premier modèle, de bout en bout"},"objectives":[{"code":"AI-3.2.1","text":{"en":"Train a model on a prepared dataset and get a prediction out of it","fr":"Entraîner un modèle sur un jeu préparé et en obtenir une prédiction"}}]},{"code":"AI-3.3","level":"L3","tier":"core","hours":3,"title":{"en":"Why accuracy is usually the wrong number","fr":"Pourquoi l'exactitude est souvent le mauvais chiffre"},"note":{"en":"A model that always says \"no\" is 99% accurate on a problem where yes happens 1% of the time, and is useless. This is the most common way a beginner fools themselves.","fr":"Un modèle qui dit toujours « non » est exact à 99 % quand « oui » arrive 1 % du temps — et il est inutile. C'est l'auto-illusion la plus courante."},"objectives":[{"code":"AI-3.3.1","text":{"en":"Build a useless model with a high accuracy score and explain exactly why the number lies","fr":"Construire un modèle inutile au score élevé et expliquer précisément pourquoi le chiffre ment"}},{"code":"AI-3.3.2","text":{"en":"Read a confusion matrix and say which kind of mistake would matter more in a stated situation","fr":"Lire une matrice de confusion et dire quelle erreur compte le plus dans une situation donnée"}}]},{"code":"AI-3.4","level":"L3","tier":"core","hours":3,"title":{"en":"Overfitting","fr":"Surapprentissage"},"objectives":[{"code":"AI-3.4.1","text":{"en":"Cause overfitting deliberately, show it in the numbers, and then reduce it","fr":"Provoquer volontairement un surapprentissage, le montrer dans les chiffres, puis le réduire"}}]},{"code":"AI-3.5","level":"L4","tier":"advanced","hours":3,"title":{"en":"When the world changes underneath","fr":"Quand le monde change sous le modèle"},"objectives":[{"code":"AI-3.5.1","text":{"en":"Explain how a model that worked last year silently stops working, and what would detect it","fr":"Expliquer comment un modèle efficace l'an dernier cesse silencieusement de l'être, et ce qui le détecterait"}}]}]},{"code":"M4","title":{"en":"Neural networks","fr":"Réseaux de neurones"},"lessons":[{"code":"AI-4.1","level":"L3","tier":"core","hours":3,"title":{"en":"What a layer does","fr":"Ce que fait une couche"},"objectives":[{"code":"AI-4.1.1","text":{"en":"Describe what one layer does to its input, without using the word \"neuron\"","fr":"Décrire ce qu'une couche fait de son entrée, sans employer le mot « neurone »"}}]},{"code":"AI-4.2","level":"L3","tier":"core","hours":3,"title":{"en":"How it learns","fr":"Comment il apprend"},"objectives":[{"code":"AI-4.2.1","text":{"en":"Explain the loop of predict, measure the error, adjust — and what makes it stop","fr":"Expliquer la boucle prédire, mesurer l'erreur, ajuster — et ce qui l'arrête"}}]},{"code":"AI-4.3","level":"L3","tier":"extension","hours":3,"title":{"en":"Different shapes for different data","fr":"Des architectures selon les données"},"objectives":[{"code":"AI-4.3.1","text":{"en":"Say why images and text need different architectures, referring to what each preserves","fr":"Dire pourquoi images et texte appellent des architectures différentes, selon ce que chacune préserve"}}]},{"code":"AI-4.4","level":"L4","tier":"advanced","hours":3,"title":{"en":"Using someone else's trained model","fr":"Réutiliser un modèle déjà entraîné"},"note":{"en":"The practical path. Training from scratch needs hardware these learners will not have; adapting an existing model needs a laptop.","fr":"La voie réaliste. Entraîner de zéro demande du matériel indisponible ici ; adapter un modèle existant demande un portable."},"objectives":[{"code":"AI-4.4.1","text":{"en":"Adapt a pre-trained model to a new task with a small dataset, and report honestly how well it did","fr":"Adapter un modèle pré-entraîné à une nouvelle tâche avec peu de données, et rapporter honnêtement le résultat"}}]}]},{"code":"M5","title":{"en":"Language models","fr":"Modèles de langue"},"lessons":[{"code":"AI-5.1","level":"L2","tier":"core","hours":2,"title":{"en":"Predicting the next word, and why that is enough","fr":"Prédire le mot suivant, et pourquoi cela suffit"},"objectives":[{"code":"AI-5.1.1","text":{"en":"Explain next-token prediction without jargon, to someone who has not studied this","fr":"Expliquer la prédiction du mot suivant sans jargon, à quelqu'un qui n'a pas étudié le sujet"}}]},{"code":"AI-5.2","level":"L2","tier":"core","hours":3,"title":{"en":"Asking well","fr":"Bien demander"},"objectives":[{"code":"AI-5.2.1","text":{"en":"Improve a weak prompt and say which specific change made the difference","fr":"Améliorer une instruction faible et dire quel changement précis a fait la différence"}}]},{"code":"AI-5.3","level":"L3","tier":"core","hours":3,"title":{"en":"Answering from your own documents","fr":"Répondre à partir de ses propres documents"},"objectives":[{"code":"AI-5.3.1","text":{"en":"Build something that answers questions from a document collection, and show it refusing when the answer is not there","fr":"Construire un outil qui répond à partir d'un corpus, et le montrer refuser quand la réponse n'y est pas"}}]},{"code":"AI-5.4","level":"L3","tier":"core","hours":3,"title":{"en":"Confidently wrong","fr":"Sûr de soi et faux"},"note":{"en":"Core, not an ethics footnote. Someone who cannot catch a fluent false answer is more dangerous with these tools than without them.","fr":"Central, pas une note d'éthique. Qui ne sait pas repérer une réponse fausse mais fluide est plus dangereux avec ces outils que sans."},"objectives":[{"code":"AI-5.4.1","text":{"en":"Catch a fluent false answer in their own subject area and describe how they verified it","fr":"Repérer une réponse fausse mais fluide dans leur domaine et décrire comment ils l'ont vérifiée"}},{"code":"AI-5.4.2","text":{"en":"Name two kinds of question where these models should not be trusted at all","fr":"Nommer deux types de questions où ces modèles ne doivent pas être crus du tout"}}]},{"code":"AI-5.5","level":"L4","tier":"advanced","hours":3,"title":{"en":"Judging whether it is actually working","fr":"Juger si cela marche vraiment"},"objectives":[{"code":"AI-5.5.1","text":{"en":"Design a test set for a language application and use it to compare two approaches","fr":"Concevoir un jeu de test pour une application de langue et comparer deux approches avec"}}]}]},{"code":"M6","title":{"en":"Putting it in front of people","fr":"Le mettre entre les mains des gens"},"lessons":[{"code":"AI-6.1","level":"L3","tier":"core","hours":3,"title":{"en":"What may not leave the building","fr":"Ce qui ne doit pas sortir"},"objectives":[{"code":"AI-6.1.1","text":{"en":"Given a dataset, identify what must not be sent to a third-party model and explain the reasoning","fr":"Pour un jeu de données, identifier ce qui ne doit pas être envoyé à un modèle tiers, et pourquoi"}}]},{"code":"AI-6.2","level":"L3","tier":"core","hours":2,"title":{"en":"Where a person has to stay in the loop","fr":"Où un humain doit rester dans la boucle"},"objectives":[{"code":"AI-6.2.1","text":{"en":"For three described uses, decide where human approval is required and justify each","fr":"Pour trois usages décrits, décider où l'approbation humaine est requise et justifier"}}]},{"code":"AI-6.3","level":"L3","tier":"extension","hours":2,"title":{"en":"Telling people what it is","fr":"Dire aux gens ce que c'est"},"objectives":[{"code":"AI-6.3.1","text":{"en":"Write what a user should be told about an AI feature so they can judge its output","fr":"Rédiger ce qu'un utilisateur doit savoir d'une fonction d'IA pour en juger le résultat"}}]},{"code":"AI-6.4","level":"L4","tier":"advanced","hours":3,"title":{"en":"What it costs to run","fr":"Ce que cela coûte à faire tourner"},"objectives":[{"code":"AI-6.4.1","text":{"en":"Estimate the cost of running a described application for a year, and find the cheaper approach","fr":"Estimer le coût annuel d'une application décrite, et trouver l'approche moins chère"}}]}]},{"code":"M7","title":{"en":"The project","fr":"Le projet"},"lessons":[{"code":"AI-7.1","level":"L2","tier":"core","hours":3,"title":{"en":"Choosing a problem worth solving","fr":"Choisir un problème qui vaut la peine"},"objectives":[{"code":"AI-7.1.1","text":{"en":"Propose a project, state how success will be measured, and say what result would mean abandoning it","fr":"Proposer un projet, dire comment le succès sera mesuré, et quel résultat justifierait de l'abandonner"}}]},{"code":"AI-7.2","level":"L2","tier":"core","hours":12,"title":{"en":"Building it","fr":"Le construire"},"objectives":[{"code":"AI-7.2.1","text":{"en":"Deliver a working project from raw data to result, with its evaluation","fr":"Livrer un projet fonctionnel des données brutes au résultat, avec son évaluation"}}]},{"code":"AI-7.3","level":"L2","tier":"core","hours":3,"title":{"en":"Presenting it honestly","fr":"Le présenter honnêtement"},"note":{"en":"The honesty is assessed. A presentation that hides where the model fails is marked down, however good the model is.","fr":"L'honnêteté est évaluée. Une présentation qui cache les échecs du modèle est pénalisée, aussi bon soit le modèle."},"objectives":[{"code":"AI-7.3.1","text":{"en":"Present the project including where it fails and who it would fail for","fr":"Présenter le projet en incluant ses échecs et pour qui il échouerait"}}]}]}]}]};

const T = {
  en: {
    level: 'WHERE THEY ARE STARTING', pace: 'HOW FAST', track: 'WHICH BRANCH',
    lessons: 'lessons', objectives: 'objectives', hours: 'teaching hours',
    daysFull: 'days full time', weeksPart: 'weeks part time',
    of: 'of', foundation: 'Foundation', branch: 'Branch',
    empty: 'Nothing in this pathway.',
    thin: 'This pathway is very short. At this entry level most of the curriculum is material the learner already has, so what remains is a specialisation rather than a programme. If an advanced cohort needs a full term, the branches need more material written at that level.',
    same: 'Steady and Standard produce the same pathway here, because there is no extra support material written above L1. That is a gap worth filling if this cohort is expected to struggle.',
    foot: 'Hours are first guesses and should be corrected against what sessions actually take — the daily log already records which lessons were covered on which day. Full time assumes four teaching hours a day, which is what a cohort sustains once breaks and setup are counted. Part time assumes two evenings a week.',
  },
  fr: {
    level: 'NIVEAU DE DÉPART', pace: 'RYTHME', track: 'FILIÈRE',
    lessons: 'leçons', objectives: 'objectifs', hours: "heures d'enseignement",
    daysFull: 'jours à plein temps', weeksPart: 'semaines à temps partiel',
    of: 'sur', foundation: 'Tronc commun', branch: 'Filière',
    empty: 'Rien dans ce parcours.',
    thin: "Ce parcours est très court. À ce niveau d'entrée, l'essentiel du programme est déjà acquis : ce qui reste est une spécialisation, pas une formation complète. Si une cohorte avancée doit occuper un trimestre, il faut écrire davantage de contenu à ce niveau.",
    same: "Progressif et Standard donnent ici le même parcours, faute de contenu d'étayage écrit au-dessus de N1. Une lacune à combler si cette cohorte risque d'être en difficulté.",
    foot: "Les durées sont des estimations à corriger d'après le temps réellement passé — le journal quotidien enregistre déjà quelles leçons ont été traitées et quand. Le plein temps suppose quatre heures d'enseignement par jour, ce qu'une cohorte tient réellement une fois pauses et installation comptées.",
  },
};

let lang = 'en';
let entryLevel = 'L0';
let pace = 'standard';
let branch = 'DEV';

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick = (v) => !v ? '' : (typeof v === 'string' ? v : (v[lang] ?? v.en ?? v.fr ?? ''));
const t = (k) => T[lang][k];

const rankOf = (code) => (DATA.levels.find((l) => l.code === code) || DATA.levels[0]).rank;

function inPathway(lesson) {
  const p = DATA.paces.find((x) => x.code === pace);
  if (rankOf(lesson.level) < rankOf(entryLevel)) return false;
  return p.tiers.includes(lesson.tier);
}

function resolve(lv, pc, br) {
  const savedL = entryLevel, savedP = pace;
  entryLevel = lv; pace = pc;
  const out = [];
  for (const track of DATA.tracks) {
    if (track.kind !== 'foundation' && track.code !== br) continue;
    for (const mod of track.modules) {
      const lessons = mod.lessons.filter(inPathway);
      if (lessons.length) out.push({ track, mod, lessons });
    }
  }
  entryLevel = savedL; pace = savedP;
  return out;
}

function render() {
  document.documentElement.lang = lang;
  document.getElementById('lblLevel').textContent = t('level');
  document.getElementById('lblPace').textContent = t('pace');
  document.getElementById('lblTrack').textContent = t('track');
  document.getElementById('foot').textContent = t('foot');

  document.getElementById('levels').innerHTML = DATA.levels.map((l) =>
    `<button class="opt" data-level="${l.code}" aria-pressed="${l.code === entryLevel}">
       ${esc(l.code)} · ${esc(pick(l.name))}<span class="sub">${esc(pick(l.desc))}</span></button>`).join('');
  document.getElementById('paces').innerHTML = DATA.paces.map((p) =>
    `<button class="opt" data-pace="${p.code}" aria-pressed="${p.code === pace}">
       ${esc(pick(p.name))}<span class="sub">${esc(pick(p.desc))}</span></button>`).join('');
  document.getElementById('branches').innerHTML = DATA.tracks.filter((x) => x.kind === 'branch').map((x) =>
    `<button class="opt" data-branch="${x.code}" aria-pressed="${x.code === branch}">
       ${esc(pick(x.name))}<span class="sub">${esc(pick(x.blurb))}</span></button>`).join('');

  const groups = resolve(entryLevel, pace, branch);
  const lessons = groups.flatMap((g) => g.lessons);
  const hours = lessons.reduce((n, l) => n + (l.hours || 0), 0);
  const objectives = lessons.reduce((n, l) => n + l.objectives.length, 0);
  const totalLessons = DATA.tracks.filter((x) => x.kind === 'foundation' || x.code === branch)
    .reduce((n, tr) => n + tr.modules.reduce((k, m) => k + m.lessons.length, 0), 0);

  const thin = lessons.length < 20;
  document.getElementById('stats').innerHTML = `
    <div class="stat ${thin ? 'warn' : ''}"><div class="n">${lessons.length}</div>
      <div class="k">${esc(t('lessons'))} ${esc(t('of'))} ${totalLessons}</div></div>
    <div class="stat"><div class="n">${objectives}</div><div class="k">${esc(t('objectives'))}</div></div>
    <div class="stat"><div class="n">${hours}</div><div class="k">${esc(t('hours'))}</div></div>
    <div class="stat"><div class="n">${Math.ceil(hours / 4)}</div><div class="k">${esc(t('daysFull'))}</div></div>
    <div class="stat"><div class="n">${Math.ceil(hours / 6)}</div><div class="k">${esc(t('weeksPart'))}</div></div>`;

  // Two honest warnings, shown only when they apply.
  const steadyN = resolve(entryLevel, 'steady', branch).flatMap((g) => g.lessons).length;
  const standardN = resolve(entryLevel, 'standard', branch).flatMap((g) => g.lessons).length;
  const warns = [];
  if (thin) warns.push(t('thin'));
  if (steadyN === standardN && pace !== 'fast') warns.push(t('same'));
  document.getElementById('warning').innerHTML = warns.map((w) => `<div class="note">${esc(w)}</div>`).join('');

  if (!lessons.length) {
    document.getElementById('out').innerHTML = `<div class="empty">${esc(t('empty'))}</div>`;
    return wire();
  }

  let html = '';
  let lastTrack = null;
  for (const g of groups) {
    if (g.track.code !== lastTrack) {
      const n = groups.filter((x) => x.track.code === g.track.code)
        .reduce((k, x) => k + x.lessons.length, 0);
      const h = groups.filter((x) => x.track.code === g.track.code)
        .reduce((k, x) => k + x.lessons.reduce((j, l) => j + l.hours, 0), 0);
      html += `<div class="trackhead" style="background:${g.track.color}">
        ${esc(pick(g.track.name))}
        <span class="sub">${esc(g.track.kind === 'foundation' ? t('foundation') : t('branch'))} · ${n} ${esc(t('lessons'))} · ${h}h</span></div>`;
      lastTrack = g.track.code;
    }
    const mh = g.lessons.reduce((k, l) => k + l.hours, 0);
    html += `<div class="mod">
      <h3>${esc(g.mod.code)} · ${esc(pick(g.mod.title))}</h3>
      <p class="modmeta">${g.lessons.length} ${esc(t('lessons'))} · ${mh}h</p>
      ${g.mod.note ? `<p class="modnote">${esc(pick(g.mod.note))}</p>` : ''}
      ${g.lessons.map((l) => `
        <div class="les">
          <div class="hd">
            <span class="code">${esc(l.code)}</span>
            <span class="ti">${esc(pick(l.title))}</span>
            <span class="tag lvl">${esc(l.level)}</span>
            <span class="tag ${l.tier}">${esc(pick((DATA.tiers.find((x) => x.code === l.tier) || {}).name))}</span>
            <span class="hrs">${l.hours}h</span>
          </div>
          ${l.note ? `<p class="modnote" style="margin:7px 0 0">${esc(pick(l.note))}</p>` : ''}
          <ul>${l.objectives.map((o) => `<li>${esc(pick(o.text))}</li>`).join('')}</ul>
        </div>`).join('')}
    </div>`;
  }
  document.getElementById('out').innerHTML = html;
  wire();
}

function wire() {
  document.querySelectorAll('[data-level]').forEach((b) =>
    b.onclick = () => { entryLevel = b.dataset.level; render(); });
  document.querySelectorAll('[data-pace]').forEach((b) =>
    b.onclick = () => { pace = b.dataset.pace; render(); });
  document.querySelectorAll('[data-branch]').forEach((b) =>
    b.onclick = () => { branch = b.dataset.branch; render(); });
  document.querySelectorAll('[data-lang]').forEach((b) =>
    b.onclick = () => {
      lang = b.dataset.lang;
      document.querySelectorAll('[data-lang]').forEach((x) =>
        x.setAttribute('aria-pressed', x.dataset.lang === lang));
      render();
    });
}

render();
</script>
</body>
</html>
