<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Log — Burkina Faso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --encre:#16233A; --papier:#E9EAE3; --carte:#FAFAF6; --reglure:#C9CDBF;
  --tampon:#A83A2C; --vert:#2E5E4E; --ambre:#8A6A1F; --sourd:#616A5C;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --slab:"Zilla Slab",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--papier);color:var(--encre);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.enveloppe{max-width:1180px;margin:0 auto;padding:0 20px 80px}

.masthead{border-bottom:2px solid var(--encre);padding:26px 0 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:14px 22px}
.masthead h1{font-family:var(--slab);font-weight:700;font-size:27px;letter-spacing:-.01em;margin:0;line-height:1.1}
.masthead .sous{font-size:13.5px;color:var(--sourd);max-width:52ch;margin:0}
.cachet{margin-left:auto;font-size:11.5px;color:var(--sourd);border:1px solid var(--reglure);border-radius:2px;padding:4px 9px;background:var(--carte);white-space:nowrap}

nav.onglets{display:flex;flex-wrap:wrap;gap:2px;margin:0 0 26px;border-bottom:1px solid var(--reglure)}
nav.onglets button{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--sourd);background:none;border:none;border-bottom:3px solid transparent;padding:13px 15px;cursor:pointer;margin-bottom:-1px}
nav.onglets button:hover{color:var(--encre)}
nav.onglets button[aria-selected="true"]{color:var(--encre);font-weight:600;border-bottom-color:var(--tampon)}
nav.onglets button:focus-visible{outline:2px solid var(--encre);outline-offset:-3px}
nav.onglets .compteur-badge{background:var(--tampon);color:#fff;font-size:10.5px;font-weight:700;border-radius:9px;padding:1px 6px;margin-left:6px;vertical-align:1px}

.grille{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
@media(min-width:940px){.grille.deux{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.panneau{background:var(--carte);border:1px solid var(--reglure);border-radius:3px;padding:22px 22px 26px;margin-bottom:28px}
.panneau:last-child{margin-bottom:0}
.panneau h2{font-family:var(--slab);font-size:18px;font-weight:600;margin:0 0 4px}
.panneau .chapeau{font-size:13px;color:var(--sourd);margin:0 0 20px}

.position{border:2px solid var(--tampon);border-radius:3px;padding:15px 17px 16px;background:#fff;position:relative;margin-bottom:26px;box-shadow:3px 3px 0 rgba(168,58,44,.12)}
.position::after{content:"RESUME HERE";position:absolute;top:-9px;right:14px;background:var(--tampon);color:#fff;font-size:10px;font-weight:700;letter-spacing:.09em;padding:2px 8px;border-radius:2px}
.position .etiq{font-size:12px;color:var(--sourd);margin:0 0 3px}
.position .lecon{font-family:var(--slab);font-size:20px;font-weight:600;line-height:1.25;margin:0 0 4px}
.position .lecon .num{color:var(--tampon);font-variant-numeric:tabular-nums;margin-right:8px}
.position .mod-ctx{font-size:12.5px;color:var(--sourd);margin:0 0 8px}
.position .meta{font-size:12.5px;color:var(--sourd);margin:0;border-top:1px solid #EDE9E2;padding-top:8px}

.champ{margin-bottom:20px}
.champ > label,.legende{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
.aide{font-size:12.5px;color:var(--sourd);margin:-3px 0 8px;font-weight:400}
select,input[type=text],input[type=date],input[type=number],textarea{font-family:var(--sans);font-size:15px;color:var(--encre);background:#fff;border:1px solid var(--reglure);border-radius:2px;padding:9px 10px;width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid var(--encre);outline-offset:-1px;border-color:var(--encre)}
textarea{resize:vertical;min-height:64px}
.rangee{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:520px){.rangee{grid-template-columns:1fr}}

.lecons{border:1px solid var(--reglure);border-radius:2px;background:#fff;max-height:270px;overflow-y:auto}
.lecons .mod{font-size:11.5px;font-weight:700;color:var(--sourd);padding:9px 12px 5px;border-top:1px solid #EEEFE8}
.lecons .mod:first-child{border-top:none}
.ligne{display:flex;align-items:flex-start;gap:10px;padding:7px 12px;cursor:pointer}
.ligne:hover{background:#F4F5EE}
.ligne input{margin-top:3px;accent-color:var(--encre);flex:none}
.ligne .num{font-variant-numeric:tabular-nums;color:var(--sourd);font-size:12.5px;flex:none;width:56px}
.ligne .txt{font-size:14px;line-height:1.35}
.ligne.prevue{background:#F6F1E8}
.ligne.prevue .txt::after{content:"planned";font-size:10.5px;color:var(--tampon);font-weight:600;margin-left:7px}

.puces{display:flex;flex-wrap:wrap;gap:7px}
.puce{font-family:var(--sans);font-size:13.5px;border:1px solid var(--reglure);background:#fff;color:var(--encre);border-radius:20px;padding:6px 13px;cursor:pointer}
.puce[aria-pressed="true"]{background:var(--encre);color:#fff;border-color:var(--encre)}
.puce:focus-visible{outline:2px solid var(--tampon);outline-offset:2px}

.obj{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dotted var(--reglure)}
.obj:last-child{border-bottom:none}
.obj .txt{font-size:13.5px;line-height:1.35;flex:1}
.obj .txt .ref{font-variant-numeric:tabular-nums;color:var(--sourd);margin-right:6px;font-size:12.5px}
.obj input{width:62px;flex:none;text-align:center;font-variant-numeric:tabular-nums}
.obj .sur{font-size:12.5px;color:var(--sourd);flex:none}
.vide{font-size:13px;color:var(--sourd);font-style:italic;padding:6px 0}

.actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px;border-top:1px solid var(--reglure);padding-top:20px;margin-top:6px}
button.primaire{font-family:var(--sans);font-size:15px;font-weight:600;background:var(--encre);color:#fff;border:none;border-radius:2px;padding:12px 22px;cursor:pointer}
button.primaire:hover{background:#0E1829}
button.primaire:focus-visible{outline:2px solid var(--tampon);outline-offset:2px}
button.discret{font-family:var(--sans);font-size:13.5px;font-weight:500;background:none;border:1px solid var(--reglure);color:var(--encre);border-radius:2px;padding:9px 14px;cursor:pointer}
button.discret:hover{border-color:var(--encre)}
.chrono{font-size:12.5px;color:var(--sourd);margin-left:auto}

.registre{background:repeating-linear-gradient(to bottom,transparent 0 33px,#E4E6DC 33px 34px),var(--carte);border:1px solid var(--reglure);border-radius:3px;padding:4px 20px 20px}
.seance{padding:15px 0 14px;border-bottom:1px solid var(--reglure)}
.seance:last-child{border-bottom:none}
.seance .tete{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:6px}
.seance .jour{font-family:var(--slab);font-weight:600;font-size:15.5px}
.seance .qui{font-size:12.5px;color:var(--sourd)}
.seance .corps{font-size:13.5px;line-height:1.55}
.seance .corps b{font-weight:600}
.seance .arret{color:var(--tampon);font-weight:600}
.seance .blocage{font-size:13px;border-left:3px solid var(--tampon);padding:5px 0 5px 11px;margin-top:8px;background:#FBF3F1}
.seance .ecart{font-size:12.5px;color:var(--sourd);margin-top:5px}
.retardif{font-size:11.5px;color:var(--tampon);font-weight:600}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--sourd);border-bottom:1px solid var(--encre);padding:0 10px 8px 0}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--reglure);vertical-align:top}
td .fort{font-weight:600}
.num{font-variant-numeric:tabular-nums}
.pastille{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:2px;white-space:nowrap}
.pastille.ok{background:#E4EDE7;color:var(--vert)}
.pastille.tiede{background:#F5EEDC;color:var(--ambre)}
.pastille.retard{background:#F7E7E4;color:var(--tampon)}
.piste-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:2px;color:#fff;white-space:nowrap}
.barre{display:flex;height:9px;border-radius:2px;overflow:hidden;background:#E7E8E0;margin:7px 0 4px}
.barre span{display:block}
.legende-mix{display:flex;flex-wrap:wrap;gap:10px 15px;font-size:12px;color:var(--sourd)}
.legende-mix i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;font-style:normal}
.formateur-bloc{padding:15px 0;border-bottom:1px solid var(--reglure)}
.formateur-bloc:last-child{border-bottom:none}
.formateur-bloc .nom{font-weight:600;font-size:14.5px}
.formateur-bloc .stat{font-size:12.5px;color:var(--sourd)}

/* exception queue */
.file{border-top:1px solid var(--reglure)}
.alerte{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid var(--reglure);align-items:flex-start}
.alerte .rang{flex:none;width:5px;border-radius:3px;align-self:stretch}
.alerte.haute .rang{background:var(--tampon)}
.alerte.moyenne .rang{background:var(--ambre)}
.alerte.basse .rang{background:var(--sourd)}
.alerte .corps{flex:1;min-width:0}
.alerte .titre{font-weight:600;font-size:14.5px;margin-bottom:2px}
.alerte .quoi{font-size:13.5px;line-height:1.5}
.alerte .faire{font-size:13px;color:var(--sourd);margin-top:5px}
.alerte .faire b{color:var(--encre);font-weight:600}
.alerte .sujet{font-size:11.5px;color:var(--sourd);margin-bottom:3px}
.calme{padding:22px 0;font-size:14px;color:var(--vert)}

/* scatter */
.nuage{width:100%;height:auto;display:block;margin:4px 0 10px}
.nuage text{font-family:var(--sans);font-size:11px;fill:var(--sourd)}
.nuage .etiq-pt{font-size:11.5px;font-weight:600;fill:var(--encre)}
.quad-note{font-size:12.5px;color:var(--sourd);line-height:1.55}

/* observation */
.rubrique{border:1px solid var(--reglure);border-radius:2px;background:#fff;padding:2px 14px}
.crit{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dotted var(--reglure)}
.crit:last-child{border-bottom:none}
.crit .n{font-variant-numeric:tabular-nums;color:var(--sourd);font-size:12.5px;flex:none;width:18px;padding-top:2px}
.crit .q{font-size:13.5px;line-height:1.4;flex:1}
.crit .sc{display:flex;gap:4px;flex:none}
.crit .sc span{width:26px;height:26px;border:1px solid var(--reglure);border-radius:2px;font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--sourd);background:#FCFCFA}
.crit .sc span.on{background:var(--encre);border-color:var(--encre);color:#fff;font-weight:600}
.futur{border:1px dashed var(--sourd);border-radius:3px;padding:14px 16px;background:#F3F4EE;font-size:13.5px;line-height:1.6;color:var(--sourd)}
.futur b{color:var(--encre)}

.remise{border:1px dashed var(--tampon);border-radius:3px;padding:16px 18px;background:#FDF7F5;margin-top:22px}
.remise h3{font-family:var(--slab);font-size:16px;margin:0 0 3px}
.remise p.chapeau{font-size:12.5px;color:var(--sourd);margin:0 0 12px}
.remise dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13.5px}
.remise dt{color:var(--sourd)}
.remise dd{margin:0}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--encre);color:#fff;font-size:14px;padding:12px 20px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:50;max-width:88vw}
#toast.vu{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
.pied{font-size:12.5px;color:var(--sourd);margin-top:34px;max-width:74ch;line-height:1.6}
</style>
</head>
<body>
<div class="enveloppe">

<header class="masthead">
  <div>
    <h1>Training Log</h1>
    <p class="sous">Daily session entry, cohort position, and instructor oversight across four tracks.</p>
  </div>
  <span class="cachet">Mockup — data held in memory</span>
</header>

<nav class="onglets" role="tablist">
  <button role="tab" aria-selected="true" data-vue="saisie">Today's entry</button>
  <button role="tab" aria-selected="false" data-vue="registre">Log</button>
  <button role="tab" aria-selected="false" data-vue="suivi">Oversight</button>
  <button role="tab" aria-selected="false" data-vue="observation">Observation</button>
  <button role="tab" aria-selected="false" data-vue="programme">Curriculum</button>
</nav>

<main id="vue"></main>
<p class="pied" id="piedNote"></p>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ tracks ============ */
const PISTES = {
  CS:  {nom:"Computer Science", couleur:"#16233A"},
  OPS: {nom:"DevOps",           couleur:"#2E5E4E"},
  SEC: {nom:"Cybersecurity",    couleur:"#A83A2C"},
  AI:  {nom:"Artificial Intelligence", couleur:"#4A5B78"}
};

/* ============ curriculum ============ */
const PROGRAMME = {
CS: [
  {id:"M1", titre:"Foundations of computing", lecons:[
    {id:"CS-1.1", titre:"How a computer works", obj:[
      {id:"CS-1.1.1", t:"Name the main hardware components and say what each does"},
      {id:"CS-1.1.2", t:"Explain what the operating system sits between and why"}]},
    {id:"CS-1.2", titre:"How data is represented", obj:[
      {id:"CS-1.2.1", t:"Convert a small number between binary and decimal"},
      {id:"CS-1.2.2", t:"Explain why text, images and numbers are all stored as bits"}]},
    {id:"CS-1.3", titre:"Files, folders and the command line", obj:[
      {id:"CS-1.3.1", t:"Move around a filesystem and create, copy and delete files from a terminal"}]}
  ]},
  {id:"M2", titre:"Thinking like a programmer", lecons:[
    {id:"CS-2.1", titre:"Breaking a problem into steps", obj:[
      {id:"CS-2.1.1", t:"Turn an everyday task into an ordered, unambiguous list of steps"}]},
    {id:"CS-2.2", titre:"Pseudocode and flowcharts", obj:[
      {id:"CS-2.2.1", t:"Write pseudocode for a problem containing a decision and a repetition"}]},
    {id:"CS-2.3", titre:"Sequence, selection and repetition", obj:[
      {id:"CS-2.3.1", t:"Trace a short algorithm by hand and predict its output correctly"}]},
    {id:"CS-2.4", titre:"Finding faults in logic", obj:[
      {id:"CS-2.4.1", t:"Locate the faulty step in a broken algorithm and correct it"}]}
  ]},
  {id:"M3", titre:"Programming fundamentals", lecons:[
    {id:"CS-3.1", titre:"Variables, types, input and output", obj:[
      {id:"CS-3.1.1", t:"Write a program that takes input, stores it and prints a result"}]},
    {id:"CS-3.2", titre:"Conditions and loops in code", obj:[
      {id:"CS-3.2.1", t:"Write a working program using an if statement and a loop"}]},
    {id:"CS-3.3", titre:"Functions and reuse", obj:[
      {id:"CS-3.3.1", t:"Rewrite repeated code as a function with parameters and a return value"}]},
    {id:"CS-3.4", titre:"Reading errors and debugging", obj:[
      {id:"CS-3.4.1", t:"Read an error message and identify the line and cause of the fault"}]}
  ]},
  {id:"M4", titre:"Data structures", lecons:[
    {id:"CS-4.1", titre:"Lists and arrays", obj:[
      {id:"CS-4.1.1", t:"Store a collection in a list and process every item in it"}]},
    {id:"CS-4.2", titre:"Dictionaries and key-value data", obj:[
      {id:"CS-4.2.1", t:"Look up a value by key and explain why it beats searching a list"}]},
    {id:"CS-4.3", titre:"Stacks and queues", obj:[
      {id:"CS-4.3.1", t:"Describe a real situation suited to a stack and one suited to a queue"}]},
    {id:"CS-4.4", titre:"Choosing the right structure", obj:[
      {id:"CS-4.4.1", t:"Pick an appropriate structure for a given problem and justify the choice"}]}
  ]},
  {id:"M5", titre:"Data and databases", lecons:[
    {id:"CS-5.1", titre:"Tables, rows and keys", obj:[
      {id:"CS-5.1.1", t:"Design a simple table with a sensible primary key"}]},
    {id:"CS-5.2", titre:"Querying with SQL", obj:[
      {id:"CS-5.2.1", t:"Write a SELECT query with a filter and a sort"}]},
    {id:"CS-5.3", titre:"Relationships between tables", obj:[
      {id:"CS-5.3.1", t:"Join two related tables and explain what the join produces"}]}
  ]},
  {id:"M6", titre:"Networks and the web", lecons:[
    {id:"CS-6.1", titre:"How the internet moves data", obj:[
      {id:"CS-6.1.1", t:"Describe the path a request takes from a device to a server and back"}]},
    {id:"CS-6.2", titre:"Clients, servers and HTTP", obj:[
      {id:"CS-6.2.1", t:"Explain what a request and a response contain"}]},
    {id:"CS-6.3", titre:"Addresses, DNS and ports", obj:[
      {id:"CS-6.3.1", t:"Explain how a domain name becomes a machine address"}]}
  ]},
  {id:"M7", titre:"Working as a developer", lecons:[
    {id:"CS-7.1", titre:"Version control basics", obj:[
      {id:"CS-7.1.1", t:"Commit a change and retrieve an earlier version of a file"}]},
    {id:"CS-7.2", titre:"Reading other people's code", obj:[
      {id:"CS-7.2.1", t:"Summarise what an unfamiliar short program does"}]},
    {id:"CS-7.3", titre:"Building a small project end to end", obj:[
      {id:"CS-7.3.1", t:"Deliver a working program that meets a written specification"}]}
  ]}
],
OPS: [
  {id:"M1", titre:"What DevOps is", lecons:[
    {id:"OPS-1.1", titre:"Why DevOps exists", obj:[
      {id:"OPS-1.1.1", t:"Describe the split between development and operations and what it costs"}]},
    {id:"OPS-1.2", titre:"The delivery lifecycle end to end", obj:[
      {id:"OPS-1.2.1", t:"List the stages from code written to code running in production"}]},
    {id:"OPS-1.3", titre:"Shared ownership and on-call", obj:[
      {id:"OPS-1.3.1", t:"Explain what a team owning its own service in production means in practice"}]}
  ]},
  {id:"M2", titre:"Linux and the command line", lecons:[
    {id:"OPS-2.1", titre:"The filesystem and navigation", obj:[
      {id:"OPS-2.1.1", t:"Find, move and inspect files from the shell without a file browser"}]},
    {id:"OPS-2.2", titre:"Users, permissions and processes", obj:[
      {id:"OPS-2.2.1", t:"Read a permissions string and fix a permission problem"},
      {id:"OPS-2.2.2", t:"Find a running process and stop it safely"}]},
    {id:"OPS-2.3", titre:"Shell scripting basics", obj:[
      {id:"OPS-2.3.1", t:"Write a script that automates a repeated three-step task"}]}
  ]},
  {id:"M3", titre:"Version control with Git", lecons:[
    {id:"OPS-3.1", titre:"Repositories, commits and history", obj:[
      {id:"OPS-3.1.1", t:"Commit work and read the history of a repository"}]},
    {id:"OPS-3.2", titre:"Branching and merging", obj:[
      {id:"OPS-3.2.1", t:"Work on a branch and merge it back"},
      {id:"OPS-3.2.2", t:"Resolve a simple merge conflict"}]},
    {id:"OPS-3.3", titre:"Pull requests and code review", obj:[
      {id:"OPS-3.3.1", t:"Open a pull request and respond to review comments"}]}
  ]},
  {id:"M4", titre:"Containers", lecons:[
    {id:"OPS-4.1", titre:"The problem containers solve", obj:[
      {id:"OPS-4.1.1", t:"Explain why an application behaves differently on two machines"}]},
    {id:"OPS-4.2", titre:"Images, containers and Dockerfiles", obj:[
      {id:"OPS-4.2.1", t:"Write a Dockerfile and build an image from it"},
      {id:"OPS-4.2.2", t:"Run a container and reach the service inside it"}]},
    {id:"OPS-4.3", titre:"Registries and multiple services", obj:[
      {id:"OPS-4.3.1", t:"Push an image to a registry and pull it on another machine"}]}
  ]},
  {id:"M5", titre:"Continuous integration and delivery", lecons:[
    {id:"OPS-5.1", titre:"Automated builds and tests", obj:[
      {id:"OPS-5.1.1", t:"Explain what a build should do before code is allowed to merge"}]},
    {id:"OPS-5.2", titre:"Building a pipeline", obj:[
      {id:"OPS-5.2.1", t:"Create a pipeline that builds and tests on every commit"}]},
    {id:"OPS-5.3", titre:"Deploying safely and rolling back", obj:[
      {id:"OPS-5.3.1", t:"Deploy a change and roll it back after a failure"}]}
  ]},
  {id:"M6", titre:"Infrastructure and monitoring", lecons:[
    {id:"OPS-6.1", titre:"Cloud infrastructure basics", obj:[
      {id:"OPS-6.1.1", t:"Describe what compute, storage and networking mean in a cloud account"}]},
    {id:"OPS-6.2", titre:"Infrastructure as code", obj:[
      {id:"OPS-6.2.1", t:"Explain why infrastructure is described in files rather than clicked together"}]},
    {id:"OPS-6.3", titre:"Logs, metrics and alerts", obj:[
      {id:"OPS-6.3.1", t:"Find the cause of a failure in a service's logs"},
      {id:"OPS-6.3.2", t:"Say what makes an alert worth waking someone for"}]}
  ]}
],
SEC: [

const AUJOURDHUI = "2026-09-01";

/* ============ derivations ============ */
const nomFormateur = id => (FORMATEURS.find(f => f.id === id) || {}).nom || id;
const cohorteInfo = id => COHORTES.find(c => c.id === id);
const pisteDe = c => cohorteInfo(c).piste;
const seancesDe = c => seances.filter(s => s.cohorte === c).sort((a,b) => a.date.localeCompare(b.date));
const jours = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const joursDepuis = d => d ? jours(d, AUJOURDHUI) : null;
const dateEn = d => new Date(d+"T00:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const dateCourte = d => new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});

function position(cohorte){
  const l = seancesDe(cohorte);
  if(!l.length) return {lecon:LECONS[pisteDe(cohorte)][0].id, depuis:null, par:null, vierge:true};
  const d = l[l.length-1];
  return {lecon:d.arret, depuis:d.date, par:d.formateur, vierge:false};
}
function avancement(cohorte){
  const vues = new Set();
  seancesDe(cohorte).forEach(s => s.traitees.forEach(l => vues.add(l)));
  return {vues:vues.size, total:LECONS[pisteDe(cohorte)].length};
}
function tauxObjectifs(liste){
  let dem = 0, poss = 0;
  liste.forEach(s => s.traitees.forEach(lid => (parId(lid)||{obj:[]}).obj.forEach(o => {
    dem += (s.objectifs[o.id] || 0); poss += s.presents;
  })));
  return poss ? dem/poss : null;
}
function rythme(liste){
  if(!liste.length) return null;
  return liste.reduce((n,s) => n + s.traitees.length, 0) / liste.length;
}
function retardSaisie(liste){
  if(!liste.length) return null;
  return liste.reduce((n,s) => n + jours(s.date, s.saisi || s.date), 0) / liste.length;
}
function derniereObs(formateurId){
  const o = observations.filter(x => x.formateur === formateurId).sort((a,b) => b.date.localeCompare(a.date))[0];
  return o ? o.date : null;
}
const scoreObs = o => o.scores.reduce((a,b) => a+b, 0) / o.scores.length;
const tagPiste = p => `<span class="piste-tag" style="background:${PISTES[p].couleur}">${PISTES[p].nom}</span>`;

/* ============ exception engine ============ */
function alertes(){
  const out = [];
  const push = (rang, sujet, titre, quoi, faire) => out.push({rang, sujet, titre, quoi, faire});

  COHORTES.forEach(c => {
    const liste = seancesDe(c.id);
    const p = position(c.id);
    const j = joursDepuis(p.depuis);

    if(!liste.length){
      push("basse", c.id+" · "+PISTES[c.piste].nom, "Cohort has not started",
        `No sessions have been logged for ${c.id} in ${c.ville}.`,
        "Confirm the start date and who is assigned before the term slips.");
      return;
    }

    if(j >= 3)
      push(j >= 7 ? "haute" : "moyenne", c.id+" · "+nomFormateur(p.par), "Logging has stopped",
        `Last entry was ${j} days ago, on ${dateCourte(p.depuis)}. The cohort's position is now unreliable.`,
        "Call the instructor today. If they have left, the handover sheet is already current as of that date.");

    const recents = liste.slice(-3);
    const taux = tauxObjectifs(recents);
    if(taux !== null && taux < 0.65)
      push("haute", c.id+" · "+nomFormateur(recents[recents.length-1].formateur), "Learners are not clearing the objectives",
        `Only ${Math.round(taux*100)}% of objective checks passed over the last ${recents.length} sessions. Other cohorts on the same material are well above this.`,
        "This is the signal that most warrants an observation visit. Do not treat it as a pace problem.");

    const derniers = liste.slice(-3).map(s => s.traitees.join(","));
    if(derniers.length === 3 && new Set(derniers).size === 1)
      push("moyenne", c.id, "Same lesson three sessions running",
        `${derniers[0]} has been logged as covered three sessions in a row.`,
        "Either the cohort is stuck or the entry is being copied forward. Both need a call.");

    const motifs = {};
    liste.slice(-6).forEach(s => { if(s.motif) motifs[s.motif] = (motifs[s.motif]||0)+1; });
    Object.keys(motifs).filter(m => motifs[m] >= 2).forEach(m =>
      push("moyenne", c.id+" · "+c.ville, "Recurring disruption: "+m.toLowerCase(),
        `Logged ${motifs[m]} times in the last ${Math.min(6,liste.length)} sessions.`,
        "This is a facilities or logistics problem, not a teaching one. Route it accordingly."));

    const parfait = liste.length >= 3 && liste.every(s =>
      !s.motif && !s.blocage && s.traitees.every(lid => (parId(lid)||{obj:[]}).obj.every(o => s.objectifs[o.id] === s.presents)));
    if(parfait)
      push("moyenne", c.id, "Log has no friction in it at all",
        "Every objective at full marks, no disruptions, no notes. Real sessions are messier than this.",
        "Verify against learner work before trusting the numbers.");
  });

  FORMATEURS.forEach(f => {
    const ss = seances.filter(s => s.formateur === f.id);
    if(!ss.length) return;

    const compte = {}; let tot = 0;
    ss.forEach(s => s.methodes.forEach(m => { compte[m] = (compte[m]||0)+1; tot++; }));
    const dom = Object.entries(compte).sort((a,b) => b[1]-a[1])[0];
    if(dom && dom[1]/tot > 0.55){
      const nomM = METHODES.find(m => m.id === dom[0]).nom.toLowerCase();
      push("moyenne", nomFormateur(f.id), "Very narrow method mix",
        `${Math.round(dom[1]/tot*100)}% of logged method use is ${nomM}. Practice and assessment barely appear.`,
        "Pair with an instructor whose mix is broader before escalating this.");
    }

    const lag = retardSaisie(ss);
    if(lag >= 2)
      push("moyenne", nomFormateur(f.id), "Entries are filed late",
        `Sessions are submitted an average of ${lag.toFixed(1)} days after they happen. Entries written from memory days later are not reliable.`,
        "Fix the habit before reading anything else in this instructor's data.");

    const obs = derniereObs(f.id);
    const jo = joursDepuis(obs);
    if(obs === null)
      push("basse", nomFormateur(f.id), "Never observed",
        "No one has sat in on a session by this instructor.",
        "Schedule when observation capacity exists.");
    else if(jo > 30)
      push("basse", nomFormateur(f.id), "Not observed recently",
        `Last observation was ${jo} days ago.`,
        "Due for a repeat visit.");
  });

  const ordre = {haute:0, moyenne:1, basse:2};
  return out.sort((a,b) => ordre[a.rang] - ordre[b.rang]);
}

const echap = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============ view: today's entry ============ */
function vueSaisie(){
  const p = position(form.cohorte), lec = parId(p.lecon), co = cohorteInfo(form.cohorte);
  const piste = co.piste, j = joursDepuis(p.depuis);

  const optCohortes = COHORTES.map(c =>
    `<option value="${c.id}" ${c.id===form.cohorte?"selected":""}>${c.id} · ${echap(c.ville)} · ${echap(PISTES[c.piste].nom)}</option>`).join("");
  const optFormateurs = FORMATEURS.map(f =>
    `<option value="${f.id}" ${f.id===form.formateur?"selected":""}>${echap(f.nom)}</option>`).join("");
  const listeLecons = PROGRAMME[piste].map(m =>
    `<div class="mod">${m.id} · ${echap(m.titre)}</div>` + m.lecons.map(l =>
      `<label class="ligne ${l.id===p.lecon?"prevue":""}">
        <input type="checkbox" data-lecon="${l.id}" ${form.traitees.has(l.id)?"checked":""}>
        <span class="num">${l.id}</span><span class="txt">${echap(l.titre)}</span>
      </label>`).join("")).join("");
  const optArret = LECONS[piste].map(l =>
    `<option value="${l.id}" ${l.id===form.arret?"selected":""}>${l.id} — ${echap(l.titre)}</option>`).join("");
  const puces = METHODES.map(m =>
    `<button type="button" class="puce" data-methode="${m.id}" aria-pressed="${form.methodes.has(m.id)}">${echap(m.nom)}</button>`).join("");
  const optPrincipale = [...form.methodes].map(id =>
    `<option value="${id}" ${id===form.principale?"selected":""}>${echap(METHODES.find(x=>x.id===id).nom)}</option>`).join("");

  const presents = parseInt(form.presents) || 0;
  const ordre = LECONS[piste].map(l => l.id);
  const objRows = [...form.traitees].sort((a,b) => ordre.indexOf(a)-ordre.indexOf(b))
    .flatMap(lid => parId(lid).obj.map(o => `<div class="obj">
      <span class="txt"><span class="ref">${o.id}</span>${echap(o.t)}</span>
      <input type="number" min="0" max="${presents||99}" data-obj="${o.id}" value="${form.objectifs[o.id] ?? ""}" aria-label="Learners who demonstrated ${o.id}">
      <span class="sur">of ${presents || "—"}</span></div>`)).join("");
  const optMotifs = MOTIFS.map(m => `<option value="${echap(m)}" ${m===form.motif?"selected":""}>${echap(m)}</option>`).join("");

  return `<div class="grille deux">
    <section class="panneau">
      <h2>Today's session</h2>
      <p class="chapeau">One entry per instructor per day. Should take three minutes.</p>
      <div class="position">
        <p class="etiq">${p.vierge ? "No sessions recorded yet. This track starts at:" : "Cohort "+form.cohorte+" stopped at:"}</p>
        <p class="lecon"><span class="num">${lec.id}</span>${echap(lec.titre)}</p>
        <p class="mod-ctx">${PISTES[piste].nom} · ${lec.module} ${echap(lec.moduleTitre)}</p>
        <p class="meta">${p.vierge ? "The first entry will set the starting point."
          : `Last session on ${dateEn(p.depuis)}, run by ${echap(nomFormateur(p.par))}${j>1?` · ${j} days ago`:""}`}</p>
      </div>
      <div class="rangee">
        <div class="champ"><label for="fCohorte">Cohort</label><select id="fCohorte">${optCohortes}</select></div>
        <div class="champ"><label for="fFormateur">Instructor today</label><select id="fFormateur">${optFormateurs}</select></div>
      </div>
      <div class="rangee">
        <div class="champ"><label for="fDate">Session date</label><input type="date" id="fDate" value="${form.date}"></div>
        <div class="champ"><label for="fPresents">Learners present</label>
          <input type="number" id="fPresents" min="0" max="${co.inscrits}" value="${form.presents}" placeholder="of ${co.inscrits} enrolled"></div>
      </div>
      <div class="champ">
        <span class="legende">Lessons actually covered</span>
        <p class="aide">Tick what was done, not what was planned.</p>
        <div class="lecons">${listeLecons}</div>
      </div>
      <div class="champ">
        <label for="fArret">Stopping point — where to resume next session</label>
        <p class="aide">This one field is what lets a stand-in pick up exactly here.</p>
        <select id="fArret">${optArret}</select>
      </div>
      <div class="champ"><span class="legende">Methods used</span><div class="puces">${puces}</div></div>
      ${form.methodes.size ? `<div class="champ"><label for="fPrincipale">Dominant method this session</label>
        <select id="fPrincipale">${optPrincipale}</select></div>` : ""}
      <div class="champ">
        <span class="legende">Objectives demonstrated</span>
        <p class="aide">How many learners passed the check for each objective.</p>
        ${objRows || `<p class="vide">Tick a lesson above to bring up its objectives.</p>`}
      </div>
      <div class="champ"><label for="fMotif">Anything that disrupted the session</label>
        <select id="fMotif"><option value="">Nothing to report</option>${optMotifs}</select></div>
      <div class="champ"><label for="fBlocage">Problem or note to flag</label>
        <textarea id="fBlocage" maxlength="240" placeholder="Optional. 240 characters.">${echap(form.blocage)}</textarea></div>
      <div class="actions">
        <button class="primaire" id="btnEnregistrer">Save session</button>
        <span class="chrono" id="compteur"></span>
      </div>
    </section>
    <aside>
      <section class="panneau">
        <h2>Recent sessions — ${form.cohorte}</h2>
        <p class="chapeau">${echap(co.ville)} · ${echap(PISTES[piste].nom)} · ${co.inscrits} enrolled</p>
        ${blocSeances(seancesDe(form.cohorte).slice(-3).reverse(), true)}
      </section>
      ${blocRemise(form.cohorte)}
    </aside>
  </div>`;
}

/* ============ shared ============ */
function blocSeances(liste, compact){
  if(!liste.length) return `<p class="vide">No sessions recorded for this cohort.</p>`;
  return liste.map(s => {
    const arret = parId(s.arret);
    const meths = s.methodes.map(m => METHODES.find(x=>x.id===m).nom).join(", ");
    const co = cohorteInfo(s.cohorte);
    const lag = jours(s.date, s.saisi || s.date);
    return `<article class="seance">
      <div class="tete"><span class="jour">${dateEn(s.date)}</span>
        <span class="qui">${echap(nomFormateur(s.formateur))}${compact?"":" · "+s.cohorte}</span>
        ${lag >= 2 ? `<span class="retardif">filed ${lag} days later</span>` : ""}</div>
      <div class="corps">
        Lessons <b>${s.traitees.join(", ")}</b> · ${s.presents} present of ${co.inscrits}<br>
        ${echap(meths)}${s.principale ? " (mostly "+echap(METHODES.find(x=>x.id===s.principale).nom.toLowerCase())+")" : ""}<br>
        Resume at <span class="arret">${arret.id} — ${echap(arret.titre)}</span>
      </div>
      ${s.motif ? `<div class="ecart">Disruption logged: ${echap(s.motif)}</div>` : ""}
      ${s.blocage ? `<div class="blocage">${echap(s.blocage)}</div>` : ""}
    </article>`;
  }).join("");
}

function blocRemise(cohorte){
  const p = position(cohorte), l = parId(p.lecon), av = avancement(cohorte);
  const liste = seancesDe(cohorte), co = cohorteInfo(cohorte);
  const derniers = [...new Set(liste.slice(-4).map(s => nomFormateur(s.formateur)))].join(", ");
  const blocages = liste.filter(s => s.blocage).slice(-2);
  return `<div class="remise">
    <h3>Handover sheet</h3>
    <p class="chapeau">Built from the log. No handover meeting needed.</p>
    <dl>
      <dt>Cohort</dt><dd>${cohorte} · ${echap(co.ville)}</dd>
      <dt>Track</dt><dd>${echap(PISTES[co.piste].nom)}</dd>
      <dt>Resume at</dt><dd><b>${l.id} — ${echap(l.titre)}</b><br><span style="color:var(--sourd)">${l.module} ${echap(l.moduleTitre)}</span></dd>
      <dt>Progress</dt><dd>${av.vues} of ${av.total} lessons</dd>
      <dt>Last session</dt><dd>${p.depuis ? dateEn(p.depuis) : "—"}</dd>
      <dt>Recent instructors</dt><dd>${echap(derniers) || "—"}</dd>
      <dt>Worth knowing</dt><dd>${blocages.length ? blocages.map(b => echap(b.blocage)).join("<br>") : "Nothing flagged."}</dd>
    </dl></div>`;
}

/* ============ view: log ============ */
function vueRegistre(){
  const optCohortes = COHORTES.map(c =>
    `<option value="${c.id}" ${c.id===form.cohorte?"selected":""}>${c.id} · ${echap(c.ville)} · ${echap(PISTES[c.piste].nom)}</option>`).join("");
  return `<div class="grille deux">
    <section>
      <div class="champ" style="max-width:380px"><label for="fCohorte">Cohort</label><select id="fCohorte">${optCohortes}</select></div>
      <div class="registre">${blocSeances(seancesDe(form.cohorte).reverse(), false)}</div>

    </section>
    <aside>${blocRemise(form.cohorte)}</aside>

}

/* ============ view: oversight ============ */
function nuagePoints(){
  const W = 640, H = 330, L = 58, R = 20, T = 18, B = 46;
  const pts = COHORTES.map(c => {
    const l = seancesDe(c.id);
    const r = rythme(l), t = tauxObjectifs(l);
    return (r === null || t === null) ? null : {id:c.id, piste:c.piste, x:r, y:t*100};
  }).filter(Boolean);
  if(!pts.length) return `<p class="vide">Not enough data to plot.</p>`;

  const xMax = 3, yMin = 40, yMax = 100;
  const px = v => L + (v/xMax) * (W-L-R);
  const py = v => T + (1 - (v-yMin)/(yMax-yMin)) * (H-T-B);
  const xMed = 1.5, yMed = 75;

  const gril = [0,0.5,1,1.5,2,2.5,3].map(v =>
    `<line x1="${px(v)}" y1="${T}" x2="${px(v)}" y2="${H-B}" stroke="#E2E4DA" stroke-width="1"/>
     <text x="${px(v)}" y="${H-B+16}" text-anchor="middle">${v}</text>`).join("") +
    [40,55,70,85,100].map(v =>
    `<line x1="${L}" y1="${py(v)}" x2="${W-R}" y2="${py(v)}" stroke="#E2E4DA" stroke-width="1"/>
     <text x="${L-8}" y="${py(v)+4}" text-anchor="end">${v}%</text>`).join("");

  const quads = `
    <line x1="${px(xMed)}" y1="${T}" x2="${px(xMed)}" y2="${H-B}" stroke="#C9CDBF" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="${L}" y1="${py(yMed)}" x2="${W-R}" y2="${py(yMed)}" stroke="#C9CDBF" stroke-width="1" stroke-dasharray="4 3"/>`;

  const cercles = pts.map(p => `
    <circle cx="${px(Math.min(p.x,xMax))}" cy="${py(Math.max(Math.min(p.y,yMax),yMin))}" r="7"
            fill="${PISTES[p.piste].couleur}" fill-opacity=".85"/>
    <text class="etiq-pt" x="${px(Math.min(p.x,xMax))+12}" y="${py(Math.max(Math.min(p.y,yMax),yMin))+4}">${p.id}</text>`).join("");

  return `<svg class="nuage" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pace against objective demonstration rate by cohort">
    ${gril}${quads}
    <line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#16233A" stroke-width="1.5"/>
    <line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#16233A" stroke-width="1.5"/>
    ${cercles}
    <text x="${(L+W-R)/2}" y="${H-8}" text-anchor="middle">Lessons covered per session</text>
    <text x="14" y="${(T+H-B)/2}" text-anchor="middle" transform="rotate(-90 14 ${(T+H-B)/2})">Objectives demonstrated</text>
  </svg>`;
}

function vueSuivi(){
  const al = alertes();
  const fileHtml = al.length ? al.map(a => `
    <div class="alerte ${a.rang}">
      <div class="rang"></div>
      <div class="corps">
        <div class="sujet">${echap(a.sujet)}</div>
        <div class="titre">${echap(a.titre)}</div>
        <div class="quoi">${echap(a.quoi)}</div>
        <div class="faire"><b>Next step.</b> ${echap(a.faire)}</div>
      </div>
    </div>`).join("") : `<p class="calme">Nothing needs a human this week.</p>`;

  const lignes = COHORTES.map(c => {
    const p = position(c.id), l = parId(p.lecon), av = avancement(c.id);
    const j = joursDepuis(p.depuis), liste = seancesDe(c.id);
    const t = tauxObjectifs(liste);
    const cls = j === null ? "retard" : j >= 7 ? "retard" : j >= 3 ? "tiede" : "ok";
    return `<tr>
      <td><span class="fort">${c.id}</span><br><span style="color:var(--sourd);font-size:12.5px">${echap(c.ville)} · ${c.inscrits} enrolled</span></td>
      <td>${tagPiste(c.piste)}</td>
      <td>${l.id}<br><span style="color:var(--sourd);font-size:12.5px">${echap(l.titre)}</span></td>
      <td class="num">${av.vues} / ${av.total}</td>
      <td class="num">${t === null ? "—" : Math.round(t*100)+"%"}</td>
      <td><span class="pastille ${cls}">${j === null ? "not started" : j === 0 ? "today" : j === 1 ? "yesterday" : j+" days"}</span></td>
    </tr>`;
  }).join("");

  const blocsF = FORMATEURS.map(f => {
    const ss = seances.filter(s => s.formateur === f.id);
    if(!ss.length) return `<div class="formateur-bloc"><span class="nom">${echap(f.nom)}</span><br><span class="stat">No sessions recorded.</span></div>`;
    const compte = {}; let tot = 0;
    ss.forEach(s => s.methodes.forEach(m => { compte[m] = (compte[m]||0)+1; tot++; }));
    const segs = METHODES.filter(m => compte[m.id]).map(m =>
      `<span style="width:${(compte[m.id]/tot*100).toFixed(1)}%;background:${m.couleur}" title="${m.nom}"></span>`).join("");
    const leg = METHODES.filter(m => compte[m.id]).map(m =>
      `<span><i style="background:${m.couleur}"></i>${echap(m.nom)}</span>`).join("");
    const taux = tauxObjectifs(ss), lag = retardSaisie(ss);
    const obs = derniereObs(f.id);
    const pistes = [...new Set(ss.map(s => pisteDe(s.cohorte)))].map(tagPiste).join(" ");
    return `<div class="formateur-bloc">
      <span class="nom">${echap(f.nom)}</span> ${pistes}
      <div class="stat">${ss.length} session${ss.length>1?"s":""} · ${taux===null?"—":Math.round(taux*100)+"%"} of objectives demonstrated
        · filed ${lag.toFixed(1)} days after the session on average
        · ${obs ? "last observed "+dateCourte(obs) : "never observed"}</div>
      <div class="barre">${segs}</div>
      <div class="legende-mix">${leg}</div>
    </div>`;
  }).join("");

  return `<div>
    <section class="panneau">
      <h2>Needs a human this week</h2>
      <p class="chapeau">Ranked by severity. Cohorts running well do not appear here.</p>
      <div class="file">${fileHtml}</div>
    </section>

    <div class="grille deux">
      <section class="panneau">
        <h2>Pace against outcomes</h2>
        <p class="chapeau">The one comparison that separates covering ground from teaching it.</p>
        ${nuagePoints()}
        <p class="quad-note">Top right is fast and landing. Top left is thorough but behind. Bottom right is the one to worry about: ground is being covered but learners are not clearing the checks. Bottom left needs help on both counts.</p>
      </section>
      <section class="panneau">
        <h2>Approach by instructor</h2>
        <p class="chapeau">Method mix, outcome rate, and how promptly entries are filed.</p>
        ${blocsF}
      </section>
    </div>

    <section class="panneau">
      <h2>Cohort positions</h2>
      <p class="chapeau">Reference view. Everything actionable is in the queue above.</p>
      <table>
        <thead><tr><th>Cohort</th><th>Track</th><th>Resume at</th><th>Lessons</th><th>Objectives</th><th>Last logged</th></tr></thead>
        <tbody>${lignes}</tbody>
      </table>
    </section>
  </div>`;
}

/* ============ view: observation ============ */
function vueObservation(){
  const rubrique = CRITERES.map((c,i) => `
    <div class="crit">
      <span class="n">${i+1}</span>
      <span class="q">${echap(c)}</span>
      <span class="sc">${ECHELLE.map((_,k) => `<span>${k+1}</span>`).join("")}</span>
    </div>`).join("");

  const faites = observations.length ? observations.map(o => `
    <div class="formateur-bloc">
      <span class="nom">${echap(nomFormateur(o.formateur))}</span> · ${o.cohorte} · ${o.lecon}
      <div class="stat">${dateEn(o.date)} · observed by ${echap(o.observateur)} · mean score ${scoreObs(o).toFixed(1)} of 4</div>
      <div style="margin:9px 0 6px">${o.scores.map((s,i) => `
        <span class="pastille ${s>=3?"ok":s===2?"tiede":"retard"}" style="margin:0 4px 4px 0" title="${echap(CRITERES[i])}">${i+1}: ${ECHELLE[s-1]}</span>`).join("")}</div>
      <div style="font-size:13.5px;line-height:1.5">${echap(o.note)}</div>
    </div>`).join("") : `<p class="vide">No observations recorded.</p>`;

  const jamais = FORMATEURS.filter(f => !derniereObs(f.id)).map(f => echap(f.nom)).join(", ");

  return `<div class="grille deux">
    <section class="panneau">
      <h2>Observation rubric</h2>
      <p class="chapeau">Eight criteria, scored 1 to 4. Filled in by whoever sat in — a site lead, a principal, or another instructor.</p>
      <div class="rubrique">${rubrique}</div>
      <p class="quad-note" style="margin-top:14px">1 Not evident · 2 Developing · 3 Secure · 4 Strong</p>
      <div class="futur" style="margin-top:18px">
        <b>Not yet in use.</b> The record type exists so the data model does not need changing later, and one sample observation is loaded so you can see the shape. Until observation capacity exists in-country, the queue treats "never observed" as a low-priority flag rather than a failure.
      </div>
    </section>
    <aside>
      <section class="panneau">
        <h2>Observations recorded</h2>
        <p class="chapeau">${observations.length} on file${jamais ? " · never observed: "+jamais : ""}</p>
        ${faites}
      </section>
    </aside>
  </div>`;
}

/* ============ view: curriculum ============ */

/* ============ render ============ */
let debutSaisie = null, minuteur = null;

function rendre(){
  document.getElementById("vue").innerHTML =
    vue === "saisie" ? vueSaisie() : vue === "registre" ? vueRegistre() :
    vue === "suivi" ? vueSuivi() : vue === "observation" ? vueObservation() : vueProgramme();

  const n = alertes().length;
  document.querySelectorAll("nav.onglets button").forEach(b => {
    b.setAttribute("aria-selected", b.dataset.vue === vue);
    if(b.dataset.vue === "suivi")
      b.innerHTML = `Oversight${n ? `<span class="compteur-badge">${n}</span>` : ""}`;
  });

  document.getElementById("piedNote").textContent =
    vue === "saisie" ? "Demonstration mockup. In the real build the session saves to the device first, then syncs to the server as soon as a connection is available."
    : vue === "suivi" ? "Every figure on this page except the observation record was entered by the person being reviewed. Treat it as a pointer to where a conversation is needed, not as proof of teaching quality."
    : vue === "observation" ? "Placeholder record type. The rubric is not in use yet."
    : vue === "programme" ? "Demonstration curriculum. Every lesson needs a completion criterion a second instructor can verify."
    : "Demonstration mockup. The data shown here is sample data.";

  if(vue === "saisie") brancherSaisie();
  if(vue === "registre") brancherRegistre();
}

function brancherSaisie(){
  const $ = id => document.getElementById(id);
  $("fCohorte").onchange = e => { form.cohorte = e.target.value; reinitSaisie(); rendre(); };
  $("fFormateur").onchange = e => { form.formateur = e.target.value; };
  $("fDate").onchange = e => { form.date = e.target.value; };
  $("fPresents").oninput = e => { form.presents = e.target.value; rendre(); };
  $("fArret").onchange = e => { form.arret = e.target.value; };
  $("fBlocage").oninput = e => { form.blocage = e.target.value; };
  $("fMotif").onchange = e => { form.motif = e.target.value; };
  if($("fPrincipale")) $("fPrincipale").onchange = e => { form.principale = e.target.value; };

  document.querySelectorAll("[data-lecon]").forEach(cb => {
    cb.onchange = e => {
      const id = e.target.dataset.lecon;
      if(e.target.checked){ form.traitees.add(id); form.arret = suivante(id); }
      else form.traitees.delete(id);
      rendre();
    };
  });
  document.querySelectorAll("[data-methode]").forEach(b => {
    b.onclick = () => {
      const id = b.dataset.methode;
      if(form.methodes.has(id)){
        form.methodes.delete(id);
        if(form.principale === id) form.principale = [...form.methodes][0] || "";
      } else { form.methodes.add(id); if(!form.principale) form.principale = id; }
      rendre();
    };
  });
  document.querySelectorAll("[data-obj]").forEach(inp => {
    inp.oninput = e => { form.objectifs[e.target.dataset.obj] = e.target.value === "" ? "" : parseInt(e.target.value); };
  });
  $("btnEnregistrer").onclick = enregistrer;

  if(!debutSaisie) debutSaisie = Date.now();
  clearInterval(minuteur);
  const tic = () => {
    const c = document.getElementById("compteur");
    if(!c) return clearInterval(minuteur);
    const s = Math.floor((Date.now() - debutSaisie)/1000);
    c.textContent = `Time on this entry: ${Math.floor(s/60)}m ${String(s%60).padStart(2,"0")}s`;
  };
  tic(); minuteur = setInterval(tic, 1000);
}

function brancherRegistre(){
  document.getElementById("fCohorte").onchange = e => { form.cohorte = e.target.value; rendre(); };
  document.getElementById("btnCsv").onclick = exporterCsv;
}

function enregistrer(){
  if(!form.traitees.size) return toast("Tick at least one lesson covered.");
  if(!form.presents) return toast("Enter how many learners were present.");
  if(!form.methodes.size) return toast("Select at least one method.");
  const objs = {};
  Object.keys(form.objectifs).forEach(k => { if(form.objectifs[k] !== "") objs[k] = form.objectifs[k]; });
  seances.push({date:form.date, saisi:AUJOURDHUI, cohorte:form.cohorte, formateur:form.formateur,
    traitees:[...form.traitees], arret:form.arret, presents:parseInt(form.presents),
    methodes:[...form.methodes], principale:form.principale, objectifs:objs,
    motif:form.motif, blocage:form.blocage});
  const secondes = Math.floor((Date.now() - debutSaisie)/1000);
  debutSaisie = null;
  reinitSaisie(); rendre();
  toast(`Session saved in ${Math.floor(secondes/60)}m ${secondes%60}s. Resume point set to ${form.arret}.`);
}

function exporterCsv(){
  const entetes = ["session_date","submitted_date","entry_lag_days","cohort","track","instructor","lessons_covered","stopping_point","present","enrolled","methods","dominant_method","objectives","disruption","flag"];
  const lignes = seances.map(s => [
    s.date, s.saisi || s.date, jours(s.date, s.saisi || s.date),
    s.cohorte, PISTES[pisteDe(s.cohorte)].nom, nomFormateur(s.formateur),
    s.traitees.join(" "), s.arret, s.presents, cohorteInfo(s.cohorte).inscrits,
    s.methodes.join(" "), s.principale,
    Object.entries(s.objectifs).map(([k,v]) => k+"="+v).join(" "),
    s.motif, s.blocage
  ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(","));
  const csv = "\uFEFF" + [entetes.join(","), ...lignes].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = "training-log.csv"; a.click();
  URL.revokeObjectURL(a.href);
  toast("Log exported.");
}

let minuteurToast = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("vu");
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => t.classList.remove("vu"), 3800);
}

document.querySelectorAll("nav.onglets button").forEach(b => {
  b.onclick = () => { vue = b.dataset.vue; rendre(); };
});
rendre();
</script>
